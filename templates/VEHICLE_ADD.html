<body class="flex h-screen overflow-hidden" style="display:flex!important;height:100vh!important;overflow:hidden!important">
    <script>window.VDMS_CONFIG={role:'[USER_ROLE]',name:'[USER_NAMA]',menuId:'VEHICLE_ADD'};</script>
    [SIDEBAR]

    <div class="flex-1 flex flex-col overflow-hidden min-w-0">
        <!-- Top bar -->
        <header class="glass border-b border-white/5 px-6 py-4 flex items-center gap-4 flex-shrink-0">
            <button onclick="window.location.href='/?type=CUSTOM_VIEW&menuId=VEHICLE_LIST'" title="Back to Inventory" style="width:34px;height:34px;border-radius:9px;border:1px solid rgba(255,255,255,.1);background:rgba(255,255,255,.05);color:#94a3b8;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:all .2s;padding:0;" onmouseenter="this.style.background='rgba(99,102,241,.15)';this.style.borderColor='rgba(99,102,241,.35)';this.style.color='#a5b4fc';" onmouseleave="this.style.background='rgba(255,255,255,.05)';this.style.borderColor='rgba(255,255,255,.1)';this.style.color='#94a3b8';" onmousedown="this.style.transform='scale(.91)'" onmouseup="this.style.transform='scale(1)'"><svg width="16" height="16" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg></button>
            <div class="flex-1">
                <h1 class="text-lg font-bold text-white" id="pageTitle">Add New Vehicle</h1>
                <p class="text-xs text-slate-500 mt-0.5">Preview: <span id="titlePreview" class="text-indigo-400 font-medium">—</span></p>
            </div>
        </header>

        <div class="flex-1 overflow-y-auto min-w-0">
          <div style="max-width:680px; margin:0 auto; padding:24px 24px 112px;">

            <!-- Basic Info -->
            <div class="form-section">
                <div class="section-title">Basic Information</div>
                <div class="form-group">
                    <label class="form-label">Vehicle Type</label>
                    <div class="flex gap-2">
                        <button class="toggle-btn active" id="btnTypeCar" onclick="setType('Car')">🚗 Car</button>
                        <button class="toggle-btn" id="btnTypeMoto" onclick="setType('Motorcycle')">🏍 Motorcycle</button>
                    </div>
                </div>
                <div class="grid2">
                    <div class="form-group">
                        <label class="form-label">Brand <span class="text-red-400">*</span></label>
                        <input id="brand" type="text" class="input-dark" placeholder="e.g. Toyota">
                    </div>
                    <div class="form-group">
                        <label class="form-label">Vehicle Name <span class="text-red-400">*</span></label>
                        <input id="vehiclename" type="text" class="input-dark" placeholder="e.g. Camry">
                    </div>
                </div>
                <div class="grid2">
                    <div class="form-group">
                        <label class="form-label">Trim / Variant <span class="text-red-400">*</span></label>
                        <input id="trim" type="text" class="input-dark" placeholder="e.g. V6 XSE">
                    </div>
                    <div class="form-group">
                        <label class="form-label">Year <span class="text-red-400">*</span></label>
                        <input id="year" type="number" class="input-dark" min="1900" max="2030">
                    </div>
                </div>
            </div>

            <!-- Pricing & Condition -->
            <div class="form-section">
                <div class="section-title">Pricing &amp; Condition</div>
                <div class="form-group">
                    <label class="form-label">Selling Price (Rupiah) <span class="text-red-400">*</span></label>
                    <div class="price-wrap">
                        <span class="price-prefix">Rp</span>
                        <input id="price" type="text" inputmode="numeric" class="price-input" placeholder="0">
                    </div>
                </div>
                <div class="form-group">
                    <label class="form-label">
                        Bought For / Cost Price
                        <span style="font-size:10px;color:rgba(148,163,184,.5);font-weight:400;margin-left:4px;">used for profit calculation</span>
                    </label>
                    <div class="price-wrap">
                        <span class="price-prefix">Rp</span>
                        <input id="costprice" type="text" inputmode="numeric" class="price-input" placeholder="0">
                    </div>
                </div>
                <div class="form-group">
                    <label class="form-label">Condition Type</label>
                    <div class="flex gap-2">
                        <button class="toggle-btn active" id="btnCondNew" onclick="setCond('New')">New</button>
                        <button class="toggle-btn" id="btnCondUsed" onclick="setCond('Used')">Used</button>
                    </div>
                </div>
                <div class="form-group">
                    <label class="form-label">Mileage (km)</label>
                    <input id="mileage" type="number" class="input-dark" placeholder="0" min="0" disabled>
                </div>
                <div class="form-group">
                    <label class="form-label">Condition Notes</label>
                    <textarea id="conditionNotes" class="input-dark" rows="3" style="resize:none" placeholder="Describe the vehicle condition…"></textarea>
                </div>
            </div>

            <!-- Photos -->
            <div class="form-section">
                <div class="section-title">Vehicle Photos <span class="text-slate-600 normal-case font-normal">(optional)</span></div>
                <input type="file" id="fileInput" accept="image/jpeg,image/png,image/webp" multiple class="hidden">
                <div id="uploadArea" class="upload-zone">
                    <div class="text-3xl mb-2">📷</div>
                    <p class="text-slate-400 font-medium text-sm">Click to upload or drag &amp; drop</p>
                    <p class="text-xs text-slate-600 mt-1">JPEG, PNG, WebP · Max 5 MB each</p>
                </div>
                <p id="uploadStatus" class="text-xs text-indigo-400 mt-2 hidden">Uploading…</p>
                <div id="photoPreview" class="flex flex-wrap gap-3 mt-4"></div>
            </div>

            <!-- Status -->
            <div class="form-section">
                <div class="section-title">Status</div>
                <div class="form-group">
                    <label class="form-label">Vehicle Status</label>
                    <div class="flex gap-2">
                        <button class="toggle-btn active" id="btnStatusAvail"  onclick="setStatus('available')">Available</button>
                        <button class="toggle-btn"        id="btnStatusRented" onclick="setStatus('rented')">Rented</button>
                        <button class="toggle-btn"        id="btnStatusSold"   onclick="setStatus('sold')">Sold</button>
                    </div>
                </div>
            </div>

          </div>
        </div>
    </div>

    <!-- Fixed footer -->
    <div id="footerBar" class="flex items-center justify-between">
        <div class="flex items-center gap-3">
            <button id="btnSave" class="btn-indigo" onclick="submitVehicle()">Save Vehicle</button>
            <button onclick="window.location.href='/?type=CUSTOM_VIEW&menuId=VEHICLE_LIST'" style="background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.1);color:#94a3b8;border-radius:8px;padding:10px 20px;font-size:13px;font-weight:500;cursor:pointer;transition:all .2s;" onmouseenter="this.style.background='rgba(255,255,255,.08)';this.style.color='#e2e8f0'" onmouseleave="this.style.background='rgba(255,255,255,.04)';this.style.color='#94a3b8'">Cancel</button>
        </div>
        <button id="btnRemove" class="btn-danger" style="display:none" onclick="confirmRemove()">Remove Vehicle</button>
    </div>

    <script>
    var menuId='VEHICLE_ADD';
    var currentType='Car', currentCond='New', currentVStatus='available', uploadedImages=[];
    var urlParams=new URLSearchParams(window.location.search);
    var vehicleId=urlParams.get('id'),EDIT_MODE=vehicleId!==null;

    function callAPI(api,data){
        return $.ajax({url:'/',type:'POST',contentType:'application/json',
            data:JSON.stringify({type:'API',menuId:menuId,data:data||{},apiName:api}),dataType:'json'})
        .then(
            function(r){if(r&&r.msg==='Unauthorized')window.location.href='/';return r;},
            function(xhr,status,err){return {status:false,data:{},msg:'Server error: '+(xhr.responseText?xhr.responseText.substring(0,200):err)};}
        );
    }

    // Admin guard
    if(window.VDMS_CONFIG&&window.VDMS_CONFIG.role!=='admin'){
        window.location.href='/?type=CUSTOM_VIEW&menuId=VEHICLE_LIST';
    }

    function updatePreview(){
        var p=[($('#brand').val()||''),($('#vehiclename').val()||''),($('#trim').val()||''),($('#year').val()||'')].filter(Boolean).join(' ');
        $('#titlePreview').text(p||'—');
    }

    function setType(t){
        currentType=t;
        $('#btnTypeCar,#btnTypeMoto').removeClass('active');
        t==='Car'?$('#btnTypeCar').addClass('active'):$('#btnTypeMoto').addClass('active');
    }

    function setCond(c){
        currentCond=c;
        $('#btnCondNew,#btnCondUsed').removeClass('active');
        c==='New'?$('#btnCondNew').addClass('active'):$('#btnCondUsed').addClass('active');
        if(c==='New'){$('#mileage').val(0).prop('disabled',true);}
        else{$('#mileage').prop('disabled',false);}
    }

    function setStatus(s){
        currentVStatus=s;
        ['btnStatusAvail','btnStatusRented','btnStatusSold'].forEach(function(id){$('#'+id).removeClass('active');});
        var map={available:'btnStatusAvail',rented:'btnStatusRented',sold:'btnStatusSold'};
        $('#'+map[s]).addClass('active');
    }

    // Upload
    function addThumb(path,idx){
        var d=$('<div class="relative group w-20 h-20">'
            +'<img src="/'+path+'" class="w-20 h-20 object-cover rounded-xl border border-white/10">'
            +'<button type="button" data-idx="'+idx+'" class="remove-img absolute top-1 right-1 w-5 h-5 rounded-full text-white text-xs flex items-center justify-center opacity-0 group-hover:opacity-100 transition-opacity" style="background:#ef4444">✕</button>'
            +'</div>');
        $('#photoPreview').append(d);
    }

    function handleFiles(files){
        if(!files||!files.length)return;
        Array.prototype.forEach.call(files,function(file){
            if(file.size>5*1024*1024){Swal.fire({icon:'warning',title:'File too large',text:file.name+' exceeds 5 MB.',background:'#0f172a',color:'#e2e8f0',confirmButtonColor:'#6366f1'});return;}
            var reader=new FileReader();
            reader.onload=function(e){
                var b64=e.target.result.split(',')[1];
                $('#uploadStatus').removeClass('hidden');
                callAPI('uploadVehicleImage_VEHICLE_ADD',{filename:file.name,filedata:b64,mimetype:file.type||'image/jpeg'})
                .done(function(r){
                    $('#uploadStatus').addClass('hidden');
                    if(r.status){var idx=uploadedImages.length;uploadedImages.push({path:r.data.path});addThumb(r.data.path,idx);}
                    else{Swal.fire({icon:'error',title:'Upload failed',text:r.msg,background:'#0f172a',color:'#e2e8f0',confirmButtonColor:'#6366f1'});}
                }).fail(function(){$('#uploadStatus').addClass('hidden');Swal.fire({icon:'error',title:'Upload failed',text:'Network error.',background:'#0f172a',color:'#e2e8f0',confirmButtonColor:'#6366f1'});});
            };
            reader.readAsDataURL(file);
        });
    }

    $(document).on('click','.remove-img',function(){
        var idx=parseInt($(this).data('idx'));
        uploadedImages.splice(idx,1);
        $(this).closest('.relative').remove();
        $('#photoPreview .remove-img').each(function(i){$(this).data('idx',i);});
    });

    $('#uploadArea').on('click',function(){$('#fileInput').trigger('click');});
    $('#fileInput').on('change',function(){handleFiles(this.files);this.value='';});
    $('#uploadArea').on('dragover',function(e){e.preventDefault();$(this).addClass('drag-over');});
    $('#uploadArea').on('dragleave',function(){$(this).removeClass('drag-over');});
    $('#uploadArea').on('drop',function(e){e.preventDefault();$(this).removeClass('drag-over');handleFiles(e.originalEvent.dataTransfer.files);});

    function collectData(){
        return{type:currentType,brand:$('#brand').val().trim(),name:$('#vehiclename').val().trim(),
            trim:$('#trim').val().trim(),year:$('#year').val().trim(),price:getRupiahValue('price'),costprice:getRupiahValue('costprice')||'0',
            condition:$('#conditionNotes').val().trim(),isnew:currentCond==='New',
            mileage:parseInt($('#mileage').val())||0,
            vstatus:currentVStatus,
            availability:currentVStatus==='available',
            images:uploadedImages.slice()};
    }

    function validate(d){
        var e=[];
        if(!d.brand)e.push('Brand is required');if(!d.name)e.push('Vehicle Name is required');
        if(!d.trim)e.push('Trim/Variant is required');if(!d.year)e.push('Year is required');
        if(!d.price)e.push('Price is required');
        if(d.year){var y=parseInt(d.year);if(isNaN(y)||y<1900||y>2030)e.push('Year must be 1900–2030');}
        if(d.price){var p=parseFloat(d.price);if(isNaN(p)||p<=0)e.push('Price must be > 0');}
        return{valid:!e.length,errors:e};
    }
    function submitVehicle(){
        var d=collectData(),v=validate(d);
        if(!v.valid){Swal.fire({icon:'warning',title:'Please fix',html:'<ul class="text-left text-sm">'+v.errors.map(function(e){return'<li>• '+e+'</li>';}).join('')+'</ul>',background:'#0f172a',color:'#e2e8f0',confirmButtonColor:'#6366f1'});return;}
        var btn=$('#btnSave');btn.prop('disabled',true).text(EDIT_MODE?'Updating…':'Saving…');
        if(EDIT_MODE)d.vehicleid=vehicleId;
        callAPI(EDIT_MODE?'updateVehicle_VEHICLE_ADD':'saveVehicle_VEHICLE_ADD',d)
        .done(function(r){
            if(r.status){Swal.fire({icon:'success',title:EDIT_MODE?'Updated!':'Saved!',text:r.msg,timer:1400,showConfirmButton:false,background:'#0f172a',color:'#e2e8f0'}).then(function(){window.location.href='/?type=CUSTOM_VIEW&menuId=VEHICLE_LIST';});}
            else{Swal.fire({icon:'error',title:'Error',text:r.msg,background:'#0f172a',color:'#e2e8f0',confirmButtonColor:'#6366f1'});btn.prop('disabled',false).text(EDIT_MODE?'Update Vehicle':'Save Vehicle');}
        });
    }

    function confirmRemove(){
        Swal.fire({title:'Remove Vehicle?',text:'This removes it from inventory.',icon:'warning',showCancelButton:true,confirmButtonText:'Remove',confirmButtonColor:'#ef4444',background:'#0f172a',color:'#e2e8f0'})
        .then(function(res){
            if(!res.isConfirmed)return;
            callAPI('removeVehicle_VEHICLE_ADD',{vehicleid:vehicleId}).done(function(r){
                if(r.status){Swal.fire({icon:'success',title:'Removed',timer:1200,showConfirmButton:false,background:'#0f172a',color:'#e2e8f0'}).then(function(){window.location.href='/?type=CUSTOM_VIEW&menuId=VEHICLE_LIST';});}
                else{Swal.fire({icon:'error',title:'Error',text:r.msg,background:'#0f172a',color:'#e2e8f0',confirmButtonColor:'#6366f1'});}
            });
        });
    }

    function prefillForm(data){
        var v=data.vehicle,imgs=data.images||[];
        setType(v.vehicletype||'Car');
        $('#brand').val(v.vehiclebrand||'');$('#vehiclename').val(v.vehiclename||'');
        $('#trim').val(v.vehicletrim||'');$('#year').val(v.vehicleyear||'');
        setRupiahValue('price', v.vehicleprice||0);
        setRupiahValue('costprice', v.vehiclecostprice||0);
        $('#conditionNotes').val(v.vehiclecondition||'');
        var isNew=v.vehicleisnew==='true'||v.vehicleisnew===true;
        setCond(isNew?'New':'Used');if(!isNew)$('#mileage').val(v.vehiclemileage||0);
        setStatus(v.vehiclestatus||'available');
        uploadedImages=[];$('#photoPreview').empty();
        imgs.forEach(function(img,i){uploadedImages.push({path:img.imagepath});addThumb(img.imagepath,i);});
        updatePreview();
    }

    $(document).ready(function(){
        if(window.VDMS_CONFIG&&window.VDMS_CONFIG.role!=='admin'){window.location.href='/?type=CUSTOM_VIEW&menuId=VEHICLE_LIST';return;}
        $('#year').val(new Date().getFullYear());
        bindRupiahInput('price');
        bindRupiahInput('costprice');

        // Pre-fill from "+ Unit" link on inventory page
        var params=new URLSearchParams(window.location.search);
        if(params.get('prefill_brand')){
            $('#brand').val(params.get('prefill_brand'));
            $('#vehiclename').val(params.get('prefill_name')||'');
            $('#trim').val(params.get('prefill_trim')||'');
            setType(params.get('prefill_type')||'Car');
            updatePreview();
        }

        if(EDIT_MODE){
            $('#pageTitle').text('Edit Vehicle');$('#btnSave').text('Update Vehicle');$('#btnRemove').show();
            callAPI('getVehicleForEdit_VEHICLE_ADD',{vehicle_id:vehicleId}).done(function(r){
                if(r.status)prefillForm(r.data);
                else Swal.fire({icon:'error',title:'Error',text:r.msg,background:'#0f172a',color:'#e2e8f0',confirmButtonColor:'#6366f1'});
            });
        }
        $('#brand,#vehiclename,#trim,#year').on('input',updatePreview);
    });
    </script>
</body>
</html>
