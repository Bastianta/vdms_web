<script>
var menuId='VEHICLE_LIST';
var viewMode='grid';
var sortCol='', sortDir='asc';

/* ── helpers ── */
function api(fn,data){
  return $.ajax({url:'/',type:'POST',contentType:'application/json',
    data:JSON.stringify({type:'API',menuId:menuId,data:data||{},apiName:fn}),dataType:'json'})
  .then(function(r){return r;},function(){return {status:false,data:{},msg:'Network error'};});
}
function rp(v){
  var n=Math.round(parseFloat(String(v||'0').replace(/[^0-9.]/g,''))||0);
  return 'Rp\u00a0'+n.toLocaleString('id-ID');
}
function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function badge(type){
  var m={available:'badge-avail',rented:'badge-rented',sold:'badge-sold',
         Car:'badge-car',Motorcycle:'badge-moto',
         'true':'badge-new','false':'badge-used'};
  var cls=m[type]||'badge-sold';
  var lbl={available:'AVAILABLE',rented:'RENTED',sold:'SOLD',
           Car:'CAR',Motorcycle:'MOTO','true':'NEW','false':'USED'}[type]||type;
  return '<span class="badge '+cls+'">'+lbl+'</span>';
}
function applyRole(){
  if(!isAdmin){
    document.querySelectorAll('[data-admin]').forEach(function(e){
      e.style.setProperty('display','none','important');
    });
  }
}
</script>

<script>
/* ── filters / sort ── */
function getFilters(){
  return {
    search:$('#fSearch').val(),
    brand:$('#fBrand').val(),
    type:$('#fType').val(),
    availability:$('#fStatus').val(),
    sortcol:sortCol, sortdir:sortDir
  };
}

function onSearch(){clearTimeout(searchTimer);searchTimer=setTimeout(function(){curPage=1;curGridPage=1;reload();},300);}

function reload(){
  curPage=1; curGridPage=1;
  if(viewMode==='grid') loadGrid(); else loadTable();
}

function doSort(col){
  if(sortCol===col){sortDir=sortDir==='asc'?'desc':'asc';}
  else{sortCol=col;sortDir='asc';}
  // keep gridSortCol in sync
  gridSortCol=col; gridSortDir=sortDir;
  updateSortUI();
  curPage=1; curGridPage=1;
  if(viewMode==='grid') loadGrid(); else loadTable();
}

function clearSort(){
  sortCol=''; sortDir='asc';
  gridSortCol='brand'; gridSortDir='asc';
  updateSortUI();
  // reset grid strip buttons
  ['gsBrand','gsPrice','gsCond','gsStatus'].forEach(function(id){
    var btn=document.getElementById(id);
    var labels={gsBrand:'Brand ↑',gsPrice:'Price',gsCond:'Condition',gsStatus:'Status'};
    if(btn){btn.className=id==='gsBrand'?'gs-btn active':'gs-btn';btn.textContent=labels[id]||id;}
  });
  curPage=1; curGridPage=1;
  if(viewMode==='grid') loadGrid(); else loadTable();
}

function updateSortUI(){
  ['hType','hAvail','hCond','hPrice'].forEach(function(id){
    var el=document.getElementById(id);
    if(el){el.className=el.className.replace(/ sort-asc| sort-desc/g,'');}
  });
  var map={type:'hType',status:'hAvail',condition:'hCond',price:'hPrice'};
  if(sortCol&&map[sortCol]){
    var el=document.getElementById(map[sortCol]);
    if(el) el.className+=' sort-'+sortDir;
  }
  ['bPrice','bCond'].forEach(function(id){
    var btn=document.getElementById(id);
    if(!btn)return;
    var bc=id==='bPrice'?'price':'condition';
    if(sortCol===bc){
      btn.style.color='#a5b4fc';btn.style.background='rgba(99,102,241,.15)';btn.style.border='1px solid rgba(99,102,241,.3)';
      btn.textContent=(bc==='price'?'Price':'Condition')+(sortDir==='asc'?' ↑':' ↓');
    }else{
      btn.style.color='';btn.style.background='';btn.style.border='';
      btn.textContent=(bc==='price'?'Price ↕':'Condition ↕');
    }
  });
  // flat mode: toggle column visibility
  var isFlat=(sortCol==='price'||sortCol==='condition');
  document.getElementById('hUnits').style.display=isFlat?'none':'';
  document.getElementById('hAvail').style.display=isFlat?'none':'';
  document.getElementById('hCond').style.display=isFlat?'':'none';
  document.getElementById('hPrice').style.display=isFlat?'':'none';
  document.getElementById('hStatus').style.display=isFlat?'':'none';
}
</script>

<script>
/* ── view toggle ── */
var gridSortCol='brand', gridSortDir='asc';

function setGridSort(col){
  if(gridSortCol===col){ gridSortDir=gridSortDir==='asc'?'desc':'asc'; }
  else { gridSortCol=col; gridSortDir='asc'; }
  // keep main sortCol in sync so filter bar buttons reflect state
  sortCol=col; sortDir=gridSortDir;
  // update grid strip buttons
  var labels={brand:'Brand',price:'Price',condition:'Condition',status:'Status'};
  ['gsBrand','gsPrice','gsCond','gsStatus'].forEach(function(id){
    var btn=document.getElementById(id);
    if(!btn) return;
    var btnCol={gsBrand:'brand',gsPrice:'price',gsCond:'condition',gsStatus:'status'}[id];
    if(btnCol===col){
      btn.className='gs-btn active';
      btn.textContent=(labels[col]||col)+(gridSortDir==='asc'?' ↑':' ↓');
    } else {
      btn.className='gs-btn';
      btn.textContent=labels[btnCol]||btnCol;
    }
  });
  // also update the filter bar sort buttons
  ['bPrice','bCond'].forEach(function(id){
    var btn=document.getElementById(id);
    if(!btn)return;
    var bc=id==='bPrice'?'price':'condition';
    if(bc===col){
      btn.style.color='#a5b4fc';btn.style.background='rgba(99,102,241,.15)';btn.style.border='1px solid rgba(99,102,241,.3)';
      btn.textContent=(bc==='price'?'Price':'Condition')+(gridSortDir==='asc'?' ↑':' ↓');
    }else{

function setView(mode){

  document.getElementById('expandBtns').style.display=mode==='table'?'inline-flex':'none';
  document.getElementById('gridSortStrip').style.display=mode==='grid'?'flex':'none';
  var tb=document.getElementById('btnTable'),gb=document.getElementById('btnGrid');

/* ── load table ── */
function loadTable(page){
  if(page) curPage=page;
  var f=getFilters();
  f.page=curPage;
  $('#tBody').html('<tr><td colspan="9" style="text-align:center;padding:48px;color:rgba(148,163,184,.4)">Loading…</td></tr>');
  api('getGroupedVehicles_VEHICLE_LIST',f).done(function(r){
    if(!r||!r.status){
      $('#tBody').html('<tr><td colspan="9" style="text-align:center;padding:48px;color:#f87171">'+(r?esc(r.msg):'Error')+'</td></tr>');
      return;
    }
    $('#lblModels').text(r.data.total_models||'0');
    $('#lblUnits').text(r.data.total_units||'0');
    var isFlat=(sortCol==='price'||sortCol==='condition');
    var html='';
    if(isFlat){
      var units=r.data.units||[];
      units.forEach(function(u){
        var lbl=esc(u._grouplabel||(u.vehiclebrand+' '+u.vehiclename+' '+u.vehicletrim));
        var ml=u.vehiclemileage&&u.vehiclemileage!=='0'?parseInt(u.vehiclemileage).toLocaleString('id-ID')+' km':'0 km';
        var img=u._firstimage||u.firstimage||'';
        var ph=img?'<img src="'+esc(img)+'" style="width:36px;height:36px;object-fit:cover;border-radius:6px" onerror="this.style.display=\'none\'">':'<div style="width:36px;height:36px;border-radius:6px;background:rgba(255,255,255,.05)"></div>';
        var act=isAdmin?'<div style="display:flex;gap:4px"><button class="btn-ghost" style="font-size:11px;padding:3px 8px" onclick="event.stopPropagation();location.href=\'/?type=CUSTOM_VIEW&menuId=VEHICLE_ADD&id='+u.vehicleid+'\'">Edit</button>'+(u.vehiclestatus==='available'?'<button class="btn-ghost" style="font-size:11px;padding:3px 8px;color:#93c5fd" onclick="event.stopPropagation();location.href=\'/?type=CUSTOM_VIEW&menuId=RENTAL\'">Rent</button><button class="btn-ghost" style="font-size:11px;padding:3px 8px;color:#6ee7b7" onclick="event.stopPropagation();location.href=\'/?type=CUSTOM_VIEW&menuId=PURCHASE\'">Sell</button>':'')+'<button class="btn-danger" onclick="event.stopPropagation();delV(\''+u.vehicleid+'\',\''+lbl+'\')">Del</button></div>':'';
        html+='<tr style="cursor:pointer" onclick="openModal(\''+u.vehicleid+'\')" onmouseenter="this.querySelector(\'td\').parentElement.querySelectorAll(\'td\').forEach(function(x){x.style.background=\'rgba(99,102,241,.05)\'})" onmouseleave="this.querySelectorAll(\'td\').forEach(function(x){x.style.background=\'\'})">'
          +'<td>'+ph+'</td><td><div style="font-weight:600;color:#e2e8f0;font-size:13px">'+lbl+'</div><div style="font-size:11px;color:rgba(148,163,184,.5)">'+esc(u.vehicleyear)+' · '+ml+'</div></td>'
          +'<td>'+badge(u.vehicletype)+'</td>'
          +'<td>'+badge(u.vehicleisnew)+'</td>'
          +'<td style="font-weight:700;color:#e2e8f0">'+rp(u.vehicleprice)+'</td>'
          +'<td>'+badge(u.vehiclestatus)+'</td>'
          +'<td data-admin>'+act+'</td></tr>';
      });
      renderPager('t',curPage,r.data.total_units,r.data.per_page,'loadTable');
      $('#tInfo').text('Showing '+(((curPage-1)*r.data.per_page)+1)+'–'+Math.min(curPage*r.data.per_page,r.data.total_units)+' of '+r.data.total_units+' units');
    } else {
      var groups=r.data.groups||[];
      groups.forEach(function(g,i){html+=buildGroupHTML(g,i);});
      renderPager('t',curPage,r.data.total_models,r.data.per_page,'loadTable');
      $('#tInfo').text(r.data.total_models+' models, '+r.data.total_units+' units');
    }
    $('#tBody').html(html||'<tr><td colspan="9" style="text-align:center;padding:48px;color:rgba(148,163,184,.4)">No vehicles found</td></tr>');
    applyRole();
  });
}
</script>

<script>
function buildGroupHTML(g,i){
  var isOpen=!!openGroups[i];
  var img=g.firstimage?'<div style="width:36px;height:36px;border-radius:6px;overflow:hidden"><img src="'+esc(g.firstimage)+'" style="width:100%;height:100%;object-fit:cover" onerror="this.style.display=\'none\'"></div>':'<div style="width:36px;height:36px;border-radius:6px;background:rgba(255,255,255,.05)"></div>';
  var pills='';
  if(g.count_available>0) pills+='<span class="badge badge-avail" style="margin-right:3px">'+g.count_available+' avail</span>';
  if(g.count_rented>0)    pills+='<span class="badge badge-rented" style="margin-right:3px">'+g.count_rented+' rented</span>';
  if(g.count_sold>0)      pills+='<span class="badge badge-sold">'+g.count_sold+' sold</span>';
  var act=isAdmin?'<button class="btn-ghost" style="font-size:11px;padding:3px 8px" onclick="event.stopPropagation();addUnit(\''+esc(g.vehiclebrand)+'\',\''+esc(g.vehiclename)+'\',\''+esc(g.vehicletrim)+'\',\''+esc(g.vehicletype)+'\')">+ Unit</button>':'';
  var html='<tr class="group-row'+(isOpen?' open':'')+'" onclick="toggleGroup('+i+',this)">'
    +'<td>'+img+'</td>'
    +'<td><span class="chevron">&#9654;</span><strong style="color:#e2e8f0">'+esc(g.vehiclebrand+' '+g.vehiclename)+'</strong><span style="font-size:11px;color:rgba(148,163,184,.5);margin-left:6px">'+esc(g.vehicletrim)+'</span></td>'
    +'<td>'+badge(g.vehicletype)+'</td>'
    +'<td><span class="badge badge-count">'+g.count_total+' unit'+(g.count_total!==1?'s':'')+'</span></td>'
    +'<td>'+pills+'</td>'
    +'<td style="display:none"></td><td style="display:none"></td><td style="display:none"></td>'
    +'<td data-admin>'+act+'</td></tr>';
  g.units.forEach(function(u,ui){
    var ml=u.vehiclemileage&&u.vehiclemileage!=='0'?parseInt(u.vehiclemileage).toLocaleString('id-ID')+' km':'0 km';
    var conn=ui===g.units.length-1?'└':'├';
    var ua=isAdmin?'<div style="display:flex;gap:4px"><button class="btn-ghost" style="font-size:11px;padding:3px 8px" onclick="event.stopPropagation();location.href=\'/?type=CUSTOM_VIEW&menuId=VEHICLE_ADD&id='+u.vehicleid+'\'">Edit</button>'+(u.vehiclestatus==='available'?'<button class="btn-ghost" style="font-size:11px;padding:3px 8px;color:#93c5fd" onclick="event.stopPropagation();location.href=\'/?type=CUSTOM_VIEW&menuId=RENTAL\'">Rent</button><button class="btn-ghost" style="font-size:11px;padding:3px 8px;color:#6ee7b7" onclick="event.stopPropagation();location.href=\'/?type=CUSTOM_VIEW&menuId=PURCHASE\'">Sell</button>':'')+'<button class="btn-danger" onclick="event.stopPropagation();delV(\''+u.vehicleid+'\',\''+esc(g.vehiclebrand+' '+g.vehiclename)+'\')">Del</button></div>':'';
    html+='<tr class="unit-row'+(isOpen?' open':'')+'" data-gidx="'+i+'" onclick="openModal(\''+u.vehicleid+'\')">'
      +'<td style="color:rgba(99,102,241,.4);font-family:monospace;font-size:12px">'+conn+'</td>'
      +'<td><div style="color:#e2e8f0;font-size:12px">Unit #'+u.vehicleid+' · '+esc(u.vehicleyear)+'</div><div style="color:rgba(148,163,184,.5);font-size:11px">'+ml+'</div></td>'
      +'<td>'+badge(u.vehicleisnew)+'</td>'
      +'<td style="font-weight:700;color:#e2e8f0">'+rp(u.vehicleprice)+'</td>'
      +'<td>'+badge(u.vehiclestatus)+'</td>'
      +'<td style="display:none"></td><td style="display:none"></td><td style="display:none"></td>'
      +'<td data-admin>'+ua+'</td></tr>';
  });
  return html;
}

function toggleGroup(i,row){
  openGroups[i]=!openGroups[i];
  var open=openGroups[i];
  $(row).toggleClass('open',open);
  $('[data-gidx="'+i+'"]').toggleClass('open',open);
}
function expandAll(){$('.group-row').addClass('open');$('.unit-row').addClass('open');Object.keys(openGroups).forEach(function(k){openGroups[k]=true;});}
function collapseAll(){$('.group-row').removeClass('open');$('.unit-row').removeClass('open');openGroups={};}
function addUnit(b,n,t,tp){location.href='/?type=CUSTOM_VIEW&menuId=VEHICLE_ADD&prefill_brand='+encodeURIComponent(b)+'&prefill_name='+encodeURIComponent(n)+'&prefill_trim='+encodeURIComponent(t)+'&prefill_type='+encodeURIComponent(tp);}
</script>

<script>
/* ── grid view ── */
function loadGrid(page){
  if(page) curGridPage=page;
  var f=getFilters();
  f.page=1; f.gridmode=true;
  $('#gBody').html('<div style="grid-column:1/-1;text-align:center;padding:48px;color:rgba(148,163,184,.4)">Loading…</div>');
  api('getGroupedVehicles_VEHICLE_LIST',f).done(function(r){
    if(!r||!r.status){
      $('#gBody').html('<div style="grid-column:1/-1;text-align:center;padding:48px;color:#f87171">'+(r?esc(r.msg):'Error')+'</div>');
      return;
    }
    $('#lblModels').text(r.data.total_models||'0');
    $('#lblUnits').text(r.data.total_units||'0');
    var allUnits=[];
    // Handle both grouped and flat mode responses
    if(r.data.mode==='flat'){
      allUnits=r.data.units||[];
      allUnits.forEach(function(u){
        u._lbl=u._grouplabel||(u.vehiclebrand+' '+u.vehiclename+' '+u.vehicletrim);
        u._img=u._firstimage||u.firstimage||'';
      });
    } else {
      var groups=r.data.groups||[];
      groups.forEach(function(g){
        g.units.forEach(function(u){
          u._lbl=g.vehiclebrand+' '+g.vehiclename+' '+g.vehicletrim;
          u._img=g.firstimage||'';
          allUnits.push(u);
        });
      });
    }
    // client-side sort for all sort types
    if(sortCol==='price'){
      allUnits.sort(function(a,b){var d=parseFloat(a.vehicleprice||0)-parseFloat(b.vehicleprice||0);return sortDir==='asc'?d:-d;});
    } else if(sortCol==='condition'){
      allUnits.sort(function(a,b){var av=a.vehicleisnew==='true'?0:1,bv=b.vehicleisnew==='true'?0:1;return sortDir==='asc'?(av-bv):(bv-av);});
    } else if(sortCol==='status'){
      var order={available:0,rented:1,sold:2};
      allUnits.sort(function(a,b){var av=order[a.vehiclestatus]||0,bv=order[b.vehiclestatus]||0;return sortDir==='asc'?(av-bv):(bv-av);});
    } else if(sortCol==='type'){
      allUnits.sort(function(a,b){var av=a.vehicletype||'',bv=b.vehicletype||'';return sortDir==='asc'?av.localeCompare(bv):bv.localeCompare(av);});
    } else {
      // default: brand A-Z (gridSortCol='brand')
      allUnits.sort(function(a,b){
        var al=(a._lbl||a._grouplabel||'').toLowerCase();
        var bl=(b._lbl||b._grouplabel||'').toLowerCase();
        return sortDir==='asc'?al.localeCompare(bl):bl.localeCompare(al);
      });
    }
    var total=allUnits.length;
    var offset=(curGridPage-1)*GRID_PER;
    var slice=allUnits.slice(offset,offset+GRID_PER);
    if(!slice.length){$('#gBody').html('<div style="grid-column:1/-1;text-align:center;padding:48px;color:rgba(148,163,184,.4)">No vehicles found</div>');return;}
    var html='';
    slice.forEach(function(u){
      var img=u._img?'<img src="'+esc(u._img)+'" style="width:100%;height:100%;object-fit:cover;display:block" onerror="this.style.display=\'none\'">':'';
      var ml=u.vehiclemileage&&u.vehiclemileage!=='0'?parseInt(u.vehiclemileage).toLocaleString('id-ID')+' km':'0 km';
      var acts='';
      if(isAdmin){
        acts='<div class="vcard-actions"><button class="btn-ghost" style="font-size:11px;padding:3px 8px;flex:1" onclick="event.stopPropagation();location.href=\'/?type=CUSTOM_VIEW&menuId=VEHICLE_ADD&id='+u.vehicleid+'\'">Edit</button>';
        if(u.vehiclestatus==='available'){acts+='<button class="btn-ghost" style="font-size:11px;padding:3px 8px;flex:1;color:#93c5fd" onclick="event.stopPropagation();location.href=\'/?type=CUSTOM_VIEW&menuId=RENTAL\'">Rent</button><button class="btn-ghost" style="font-size:11px;padding:3px 8px;flex:1;color:#6ee7b7" onclick="event.stopPropagation();location.href=\'/?type=CUSTOM_VIEW&menuId=PURCHASE\'">Sell</button>';}
        acts+='</div>';
      }
      var cp=parseFloat(u.vehiclecostprice||0);
      html+='<div class="vcard" onclick="openModal(\''+u.vehicleid+'\')"><div class="vcard-img">'+img+'</div>'
        +'<div class="vcard-body"><div style="font-weight:700;color:#e2e8f0;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">'+esc(u._lbl)+'</div>'
        +'<div style="font-size:11px;color:rgba(148,163,184,.5);margin-top:2px">'+esc(u.vehicleyear)+' · '+ml+'</div>'
        +'<div style="font-weight:700;color:#a5b4fc;font-size:14px;margin-top:6px">'+rp(u.vehicleprice)+'</div>'
        +(isAdmin&&cp>0?'<div style="font-size:11px;color:rgba(251,191,36,.7);margin-top:2px">Cost: '+rp(cp)+'</div>':'')
        +'<div style="display:flex;gap:4px;flex-wrap:wrap;margin-top:6px">'+badge(u.vehicletype)+badge(u.vehicleisnew)+badge(u.vehiclestatus)+'</div></div>'+acts+'</div>';
    });
    $('#gBody').html(html);
    renderPager('g',curGridPage,total,GRID_PER,'loadGrid');
    $('#gInfo').text('Showing '+(offset+1)+'–'+Math.min(offset+GRID_PER,total)+' of '+total+' units');
    applyRole();
  });
}
</script>

<script>
/* ── pagination ── */
function renderPager(pfx,page,total,per,fn){
  var tp=Math.ceil(total/per)||1;
  if(tp<=1){$('#'+pfx+'Pager').html('');return;}
  var h='';
  h+='<button class="btn-ghost" style="padding:5px 12px;font-size:12px;opacity:'+(page<=1?'.35':'1')+'"'+(page>1?' onclick="'+fn+'('+(page-1)+')"':'')+'>‹ Prev</button>';
  var s=Math.max(1,page-2),e=Math.min(tp,page+2);
  if(s>1) h+='<button class="btn-ghost" style="padding:5px 10px;font-size:12px" onclick="'+fn+'(1)">1</button>'+(s>2?'<span style="color:rgba(148,163,184,.3);padding:0 3px">…</span>':'');
  for(var i=s;i<=e;i++){var a=i===page?';background:rgba(99,102,241,.3);color:#a5b4fc;border-color:rgba(99,102,241,.4)':'';h+='<button class="btn-ghost" style="padding:5px 10px;font-size:12px;min-width:32px'+a+'" onclick="'+fn+'('+i+')">'+i+'</button>';}
  if(e<tp) h+=(e<tp-1?'<span style="color:rgba(148,163,184,.3);padding:0 3px">…</span>':'')+'<button class="btn-ghost" style="padding:5px 10px;font-size:12px" onclick="'+fn+'('+tp+')">'+tp+'</button>';
  h+='<button class="btn-ghost" style="padding:5px 12px;font-size:12px;opacity:'+(page>=tp?'.35':'1')+'"'+(page<tp?' onclick="'+fn+'('+(page+1)+')"':'')+'>Next ›</button>';
  $('#'+pfx+'Pager').html(h);
}

/* ── detail modal ── */
window._mid=null;
function openModal(id){
  window._mid=id;
  api('getVehicleDetail_VEHICLE_LIST',{vehicle_id:id}).done(function(r){
    if(!r||!r.status){Swal.fire({icon:'error',title:'Error',text:r?r.msg:'Error',background:'#0f172a',color:'#e2e8f0',confirmButtonColor:'#6366f1'});return;}
    var v=r.data.vehicle,imgs=r.data.images||[];
    document.getElementById('mTitle').textContent=[v.vehiclebrand,v.vehiclename,v.vehicletrim,v.vehicleyear].filter(Boolean).join(' ');
    document.getElementById('mBadge').innerHTML=badge(v.vehiclestatus);
    document.getElementById('mType').textContent=v.vehicletype||'—';
    document.getElementById('mBrand').textContent=v.vehiclebrand||'—';
    document.getElementById('mName').textContent=v.vehiclename||'—';
    document.getElementById('mTrim').textContent=v.vehicletrim||'—';
    document.getElementById('mYear').textContent=v.vehicleyear||'—';
    document.getElementById('mPrice').textContent=rp(v.vehicleprice);
    document.getElementById('mCond').textContent=v.vehicleisnew==='true'?'New':'Used';
    document.getElementById('mMile').textContent=v.vehiclemileage&&v.vehiclemileage!=='0'?parseInt(v.vehiclemileage).toLocaleString('id-ID')+' km':'0 km';
    document.getElementById('mNotes').textContent=v.vehiclecondition||'—';
    var allImgs=imgs.length?imgs.map(function(i){return i.imagepath;}):(v.vehicleimagepath?[v.vehicleimagepath]:[]);
    var mi=document.getElementById('mImg'),ni=document.getElementById('mNoImg'),td=document.getElementById('mThumbs');
    td.innerHTML='';
    if(allImgs.length){mi.src=allImgs[0];mi.style.display='block';ni.style.display='none';
      allImgs.forEach(function(src,idx){var t=document.createElement('img');t.src=src;t.style='width:56px;height:56px;object-fit:cover;border-radius:8px;cursor:pointer;flex-shrink:0;border:2px solid '+(idx===0?'#6366f1':'transparent');t.onclick=(function(s,el){return function(){mi.src=s;td.querySelectorAll('img').forEach(function(x){x.style.borderColor='transparent';});el.style.borderColor='#6366f1';};})(src,t);td.appendChild(t);});
    }else{mi.style.display='none';ni.style.display='';}
    $('#detailModal').addClass('modal-open'); applyRole();
  });
}
function closeModal(){$('#detailModal').removeClass('modal-open');}
$('#detailModal').on('click',function(e){if(e.target===this)closeModal();});

/* ── delete ── */
function delV(id,title){
  Swal.fire({title:'Remove "'+title+'"?',text:'This removes the vehicle from inventory.',icon:'warning',showCancelButton:true,confirmButtonText:'Remove',confirmButtonColor:'#ef4444',background:'#0f172a',color:'#e2e8f0'})
  .then(function(res){
    if(!res.isConfirmed)return;
    api('deleteVehicle_VEHICLE_LIST',{vehicleid:id}).done(function(r){
      if(r&&r.status){Swal.fire({icon:'success',title:'Removed',timer:1200,showConfirmButton:false,background:'#0f172a',color:'#e2e8f0'}).then(function(){if(viewMode==='grid')loadGrid();else loadTable();});}
      else Swal.fire({icon:'error',title:'Error',text:r?r.msg:'Error',background:'#0f172a',color:'#e2e8f0',confirmButtonColor:'#6366f1'});
    });
  });
}
</script>

<script>
/* ── init ── */
$(document).ready(function(){
  isAdmin=(window.VDMS_CONFIG&&window.VDMS_CONFIG.role==='admin');

  api('getBrands_VEHICLE_LIST',{}).done(function(r){

});

/* mobileFilterSetup — VEHICLE_LIST */
(function(){
  if(window.innerWidth>768) return;
  // Mirror filter values from desktop selects (they still exist in DOM, just hidden)
  function buildMobileFilter(){
    var body=document.getElementById('mobileFilterBody');
    if(!body) return;
    body.innerHTML=
      '<div><label class="mfp-label">Search</label><input class="mfp-input" id="mfSearch" placeholder="Brand, model…" value="'+($('#fSearch').val()||'')+'" oninput="document.getElementById('fSearch').value=this.value"></div>'
      +'<div><label class="mfp-label">Brand</label><select class="mfp-input" id="mfBrand" onchange="document.getElementById('fBrand').value=this.value"><option value="">All Brands</option></select></div>'
      +'<div><label class="mfp-label">Type</label><select class="mfp-input" id="mfType" onchange="document.getElementById('fType').value=this.value"><option value="">All Types</option><option value="Car">Car</option><option value="Motorcycle">Motorcycle</option></select></div>'
      +'<div><label class="mfp-label">Status</label><select class="mfp-input" id="mfStatus" onchange="document.getElementById('fStatus').value=this.value"><option value="">All Status</option><option value="available">Available</option><option value="rented">Rented</option><option value="sold">Sold</option></select></div>'
      +'<button class="mfp-apply" onclick="applyMobileFilter()">Apply Filters</button>';
    // copy brand options
    var brands=document.getElementById('fBrand');
    var mBrands=document.getElementById('mfBrand');
    if(brands&&mBrands){ Array.from(brands.options).forEach(function(o){ var n=document.createElement('option');n.value=o.value;n.text=o.text;mBrands.appendChild(n); }); }
    document.getElementById('mfStatus').value=$('#fStatus').val()||'';
    document.getElementById('mfType').value=$('#fType').val()||'';
  }
  function applyMobileFilter(){
    reload();
    closeMobileFilter();
  }
  window.applyMobileFilter=applyMobileFilter;
  document.getElementById('mobileFilterBtn').addEventListener('click', buildMobileFilter);
})();

</script>
