<script>
(function () {
    // Role from Oden injection + window.VDMS_CONFIG
    var role = (window.VDMS_CONFIG && window.VDMS_CONFIG.role) || '[USER_ROLE]';
    var name = (window.VDMS_CONFIG && window.VDMS_CONFIG.name) || '[USER_NAMA]';

    // Set avatar letter
    var avatarEl = document.getElementById('sbAvatar');
    if (avatarEl && name) avatarEl.textContent = name.charAt(0).toUpperCase();

    // Set username display
    var unameEl = document.getElementById('sbUsername');
    if (unameEl && name) unameEl.textContent = name;

    // Set role badge
    var badgeEl   = document.getElementById('sbRoleBadge');
    var labelEl   = document.getElementById('sbRoleLabel');
    var roleMap   = { admin: ['role-admin','Administrator'], sales: ['role-sales','Sales Staff'], viewer: ['role-viewer','View Only'] };
    var roleInfo  = roleMap[role] || ['role-viewer', role];
    if (badgeEl)  { badgeEl.className = 'role-badge ' + roleInfo[0] + ' mt-0.5'; }
    if (labelEl)  { labelEl.textContent = roleInfo[1]; }

    // Hide sections not allowed for current role
    var roleLevel = { admin: 3, sales: 2, viewer: 1 }[role] || 1;
    document.querySelectorAll('[data-min-role]').forEach(function (el) {
        var minRole = { admin: 3, sales: 2, viewer: 1 }[el.dataset.minRole] || 99;
        if (roleLevel < minRole) el.style.display = 'none';
    });

    // Active state based on current menuId
    var currentMenu = (window.VDMS_CONFIG && window.VDMS_CONFIG.menuId) || '';
    document.querySelectorAll('.sb-nav-item[data-menu]').forEach(function (el) {
        if (el.dataset.menu === currentMenu) el.classList.add('active');
    });
})();

function doLogout() {
    $.ajax({
        url: '/', type: 'POST', contentType: 'application/json',
        data: JSON.stringify({ type: 'API', menuId: 'LOGIN', data: {}, apiName: 'logout_LOGIN' }),
        dataType: 'json'
    }).always(function () { window.location.href = '/'; });
}

// ── Global Rupiah Input Formatter ──────────────────────────────────
// Usage: bindRupiahInput('inputId')
// The visible input shows "200.000.000", but getRupiahValue('inputId')
// returns the plain number 200000000 for API calls.
// setRupiahValue('inputId', 200000000) fills and formats the field.
window.bindRupiahInput = function(id) {
    var el = document.getElementById(id);
    if (!el) return;
    el.setAttribute('inputmode', 'numeric');
    el.setAttribute('autocomplete', 'off');
    el.addEventListener('input', function() {
        var pos = el.selectionStart;
        var raw = el.value.replace(/\./g, '').replace(/[^0-9]/g, '');
        var formatted = raw ? parseInt(raw, 10).toLocaleString('id-ID') : '';
        var diff = formatted.length - el.value.length;
        el.value = formatted;
        try { el.setSelectionRange(pos + diff, pos + diff); } catch(e) {}
    });
    el.addEventListener('blur', function() {
        var raw = el.value.replace(/\./g, '').replace(/[^0-9]/g, '');
        el.value = raw ? parseInt(raw, 10).toLocaleString('id-ID') : '';
    });
};
window.getRupiahValue = function(id) {
    var el = document.getElementById(id);
    if (!el) return '';
    // Strip thousand-separator dots (Indonesian format uses . as thousands sep)
    // The input is always an integer formatted as "200.000.000" — no decimal dot
    return el.value.replace(/\./g, '').replace(/[^0-9]/g, '') || '';
};

/* ── Mobile sidebar & filter ── */
function toggleSidebar(){
    var sb=document.getElementById('vdms-sidebar'),ov=document.getElementById('sb-overlay'),hb=document.getElementById('sb-hamburger');
    if(!sb)return;
    var open=sb.classList.contains('mobile-open');
    sb.classList.toggle('mobile-open',!open);
    if(ov)ov.classList.toggle('visible',!open);
    if(hb)hb.classList.toggle('active',!open);
}
function closeSidebar(){
    var sb=document.getElementById('vdms-sidebar'),ov=document.getElementById('sb-overlay'),hb=document.getElementById('sb-hamburger');
    if(sb)sb.classList.remove('mobile-open');
    if(ov)ov.classList.remove('visible');
    if(hb)hb.classList.remove('active');
}
document.querySelectorAll('.sb-nav-item').forEach(function(el){
    el.addEventListener('click',function(){ if(window.innerWidth<=768) closeSidebar(); });
});
function openMobileFilter(){
    var p=document.getElementById('mobileFilterPanel'),o=document.getElementById('mobileFilterOverlay');
    if(p)p.classList.add('open'); if(o)o.classList.add('visible');
    document.body.style.overflow='hidden';
}
function closeMobileFilter(){
    var p=document.getElementById('mobileFilterPanel'),o=document.getElementById('mobileFilterOverlay');
    if(p)p.classList.remove('open'); if(o)o.classList.remove('visible');
    document.body.style.overflow='';
}

window.setRupiahValue = function(id, val) {
    var el = document.getElementById(id);
    if (!el) return;
    // val may come as "2000000.00" (DB string) or 2000000 (number) or "2.000.000" (formatted)
    // Use parseFloat directly on the original value — handles "2000000.00" correctly
    var raw = String(val).replace(/[^0-9.]/g, ''); // keep digits and ONE decimal dot
    var n = parseFloat(raw) || 0;
    el.value = n ? Math.round(n).toLocaleString('id-ID') : '';
};
