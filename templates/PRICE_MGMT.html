    <style>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        * { font-family: 'Inter', sans-serif; }
        body { background: #020817; color: #e2e8f0; }

        .glass { background: rgba(15,23,42,0.8); border: 1px solid rgba(99,102,241,0.12); backdrop-filter: blur(12px); }
        .glass-sm { background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.06); }

        .input-dark {
            background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.08);
            color: #e2e8f0; border-radius: 8px; padding: 8px 12px; font-size: 13px;
            transition: all 0.2s;
        }
        .input-dark:focus { outline: none; border-color: #6366f1; background: rgba(99,102,241,0.08); box-shadow: 0 0 0 3px rgba(99,102,241,0.12); }
        .input-dark::placeholder { color: rgba(148,163,184,0.4); }
        select.input-dark option { background: #0f172a; }

        .btn-indigo { background: linear-gradient(135deg,#6366f1,#8b5cf6); color:#fff; border:none; border-radius:8px; padding:8px 16px; font-size:13px; font-weight:600; cursor:pointer; transition:all .2s; }
        .btn-indigo:hover { opacity:.9; transform:translateY(-1px); box-shadow:0 6px 20px rgba(99,102,241,.35); }
        .btn-sm { padding:5px 12px; font-size:12px; }
        .btn-ghost { background:rgba(255,255,255,.04); border:1px solid rgba(255,255,255,.08); color:#94a3b8; border-radius:8px; padding:8px 14px; font-size:13px; cursor:pointer; transition:all .2s; }
        .btn-ghost:hover { background:rgba(255,255,255,.08); color:#e2e8f0; }

        /* Table */
        .data-table { width:100%; border-collapse:collapse; }
        .data-table th { font-size:10px; font-weight:700; letter-spacing:.08em; text-transform:uppercase; color:rgba(148,163,184,.5); padding:10px 14px; border-bottom:1px solid rgba(255,255,255,.05); text-align:left; white-space:nowrap; }
        .data-table td { padding:12px 14px; border-bottom:1px solid rgba(255,255,255,.04); font-size:13px; vertical-align:middle; }
        .data-table tr:hover td { background:rgba(99,102,241,.04); }
        .data-table td:first-child { padding-left:14px; }

        /* Checkbox */
        .check-row { width:16px; height:16px; accent-color:#6366f1; cursor:pointer; }

        /* Change badge */
        .change-up   { color:#34d399; background:rgba(52,211,153,.1); border:1px solid rgba(52,211,153,.2); }
        .change-down { color:#f87171; background:rgba(248,113,113,.1); border:1px solid rgba(248,113,113,.2); }
        .change-badge { display:inline-flex; align-items:center; gap:3px; padding:2px 7px; border-radius:6px; font-size:11px; font-weight:600; }

        /* History modal */
        #historyModal { display:none; position:fixed; inset:0; z-index:50; background:rgba(0,0,0,.7); backdrop-filter:blur(4px); }
        .history-card { background:#0d1629; border:1px solid rgba(99,102,241,.2); border-radius:16px; width:620px; max-height:80vh; display:flex; flex-direction:column; }

        /* Price edit modal */
        #priceEditModal { display:none; position:fixed; inset:0; z-index:50; background:rgba(0,0,0,.7); backdrop-filter:blur(4px); }
        .edit-card { background:#0d1629; border:1px solid rgba(99,102,241,.2); border-radius:16px; width:440px; }

        .modal-open { display:flex !important; align-items:center; justify-content:center; }

        /* Stat card */
        .stat-card { background:rgba(255,255,255,.03); border:1px solid rgba(255,255,255,.06); border-radius:12px; padding:16px 18px; }
        .stat-card .stat-val { font-size:22px; font-weight:700; color:#fff; }
        .stat-card .stat-lbl { font-size:11px; color:rgba(148,163,184,.6); margin-top:2px; font-weight:500; letter-spacing:.03em; }
        .stat-card .stat-icon { width:36px; height:36px; border-radius:10px; display:flex; align-items:center; justify-content:center; }

        /* Bulk panel */
        #bulkPanel { display:none; }
        #bulkPanel.visible { display:flex; }
    </style>
</head>
<body class="flex h-screen overflow-hidden" style="display:flex!important;height:100vh!important;overflow:hidden!important">
    [SIDEBAR]
    <script>
        window.VDMS_CONFIG = { role: '[USER_ROLE]', name: '[USER_NAMA]', menuId: 'PRICE_MGMT' };
    </script>

    <!-- Main -->
    <div class="flex-1 flex flex-col overflow-hidden min-w-0">

        <!-- Top bar -->
        <header class="glass border-b border-white/5 px-6 py-4 flex items-center gap-4 flex-shrink-0">
            <div class="flex-1">
                <h1 class="text-lg font-bold text-white tracking-tight">Price Manager</h1>
                <p class="text-xs text-slate-500 mt-0.5">Monitor and update vehicle pricing · view history</p>
            </div>
            <!-- Bulk actions bar (shown when rows selected) -->
            <div id="bulkPanel" class="items-center gap-3 bg-indigo-900/30 border border-indigo-500/20 rounded-xl px-4 py-2">
                <span class="text-xs text-indigo-300 font-medium" id="bulkCount">0 selected</span>
                <input type="number" id="bulkPct" placeholder="±%" class="input-dark w-20 text-center" step="0.1">
                <input type="text" id="bulkReason" placeholder="Reason (optional)" class="input-dark w-48">
                <button class="btn-indigo btn-sm" onclick="doBulkUpdate()">Apply %</button>
                <button class="btn-ghost btn-sm" onclick="clearSelection()">Clear</button>
            </div>
            <button class="btn-ghost flex items-center gap-2" onclick="loadPrices(currentPage)">
                <svg width="14" height="14" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="1 4 1 10 7 10"/><path d="M3.51 15a9 9 0 102.13-9.36L1 10"/></svg>
                Refresh
            </button>
        </header>

        <!-- Filters -->
        <div class="px-6 py-3 flex items-center gap-3 border-b border-white/5 flex-shrink-0 flex-wrap">
            <input type="text" id="searchInput" placeholder="Search brand, name, trim…" class="input-dark w-56"
                oninput="debounceSearch()">
            <select id="typeFilter" class="input-dark" onchange="loadPrices(1)">
                <option value="">All Types</option>
                <option value="Car">Car</option>
                <option value="Motorcycle">Motorcycle</option>
            </select>
            <label class="flex items-center gap-2 text-sm text-slate-400 cursor-pointer ml-2">
                <input type="checkbox" id="selectAllChk" class="check-row" onchange="toggleSelectAll()">
                Select all on page
            </label>
        </div>

        <!-- Table area -->
        <div class="flex-1 overflow-auto px-6 py-4">
            <div class="glass rounded-xl overflow-hidden">
                <table class="data-table" id="priceTable">
                    <thead>
                        <tr>
                            <th style="width:36px"></th>
                            <th>Vehicle</th>
                            <th>Type</th>
                            <th>Year</th>
                            <th>Current Price</th>
                            <th>Last Change</th>
                            <th>Changes</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="priceBody">
                        <tr><td colspan="8" class="text-center py-12 text-slate-500">Loading…</td></tr>
                    </tbody>
                </table>
            </div>

            <!-- Pagination -->
            <div class="flex items-center justify-between mt-4 text-sm text-slate-500" id="paginationBar">
                <span id="paginationInfo"></span>
                <div class="flex gap-2" id="paginationBtns"></div>
            </div>
        </div>
    </div>

    <!-- ── Price Edit Modal ── -->
    <div id="priceEditModal">
      <div class="edit-card p-6">
        <div class="flex items-center justify-between mb-5">
            <div>
                <h3 class="font-bold text-white text-base" id="editModalTitle">Update Price</h3>
                <p class="text-xs text-slate-500 mt-0.5" id="editModalSub"></p>
            </div>
            <button onclick="closeEditModal()" class="text-slate-500 hover:text-white transition-colors">
                <svg width="18" height="18" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
            </button>
        </div>
        <div class="space-y-4">
            <div>
                <label class="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-1.5">Current Price</label>
                <div class="text-lg font-bold text-indigo-400" id="editCurrentPrice">—</div>
            </div>
            <div>
                <label class="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-1.5">New Price (Rp) *</label>
                <input type="text" inputmode="numeric" id="editNewPrice" class="input-dark w-full" placeholder="0">
            </div>
            <div>
                <label class="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-1.5">Reason</label>
                <input type="text" id="editReason" class="input-dark w-full" placeholder="e.g. Market adjustment, new stock…">
            </div>
        </div>
        <div class="flex gap-3 mt-6">
            <button class="btn-indigo flex-1" onclick="submitPriceEdit()">Update Price</button>
            <button class="btn-ghost flex-1" onclick="closeEditModal()">Cancel</button>
        </div>
      </div>
    </div>

    <!-- ── Price History Modal ── -->
    <div id="historyModal">
      <div class="history-card p-0">
        <!-- Header -->
        <div class="px-6 py-4 border-b border-white/5 flex items-center justify-between flex-shrink-0">
            <div>
                <h3 class="font-bold text-white text-base" id="historyModalTitle">Price History</h3>
                <p class="text-xs text-slate-500 mt-0.5" id="historyModalSub"></p>
            </div>
            <button onclick="closeHistoryModal()" class="text-slate-500 hover:text-white transition-colors">
                <svg width="18" height="18" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
            </button>
        </div>
        <!-- History list -->
        <div class="overflow-y-auto p-4 space-y-2" id="historyList" style="max-height:55vh">
            <div class="text-center text-slate-500 py-8">Loading…</div>
        </div>
      </div>
    </div>

    <script>
    var menuId = 'PRICE_MGMT';
    var currentPage = 1;
    var totalPages  = 1;
    var selectedIds = new Set();
    var editVehicleId = null;
    var searchTimer = null;
    var isAdmin = window.VDMS_CONFIG.role === 'admin';

    function callAPI(api, data) {
        return $.ajax({ url:'/', type:'POST', contentType:'application/json',
            data: JSON.stringify({ type:'API', menuId:menuId, data:data||{}, apiName:api }),
            dataType:'json' });
    }

    function rp(val) {
        var n = parseFloat(val||0);
        return 'Rp\u00a0' + n.toLocaleString('id-ID');
    }

    function debounceSearch() {
        clearTimeout(searchTimer);
        searchTimer = setTimeout(function(){ loadPrices(1); }, 350);
    }

    /* ── Load table ── */
    function loadPrices(page) {
        currentPage = page || 1;
        selectedIds.clear();
        updateBulkPanel();
        $('#selectAllChk').prop('checked', false);

        callAPI('getVehiclePrices_' + menuId, {
            search: $('#searchInput').val(),
            type:   $('#typeFilter').val(),
            page:   currentPage
        }).done(function(r) {
            if (!r.status) { renderError(r.msg); return; }
            renderTable(r.data.vehicles);
            renderPagination(r.data.total, r.data.page, r.data.per_page);
        }).fail(function(){ renderError('Network error'); });
    }

    function renderError(msg) {
        $('#priceBody').html('<tr><td colspan="8" class="text-center py-10 text-red-400">'+msg+'</td></tr>');
    }

    function renderTable(rows) {
        if (!rows || !rows.length) {
            $('#priceBody').html('<tr><td colspan="8" class="text-center py-12 text-slate-500">No vehicles found</td></tr>');
            return;
        }
        var html = '';
        rows.forEach(function(v) {
            var pct    = v.lastpricechange
                ? ((parseFloat(v.lastpricechange) - parseFloat(v.vehicleprice)) / parseFloat(v.vehicleprice) * 100).toFixed(1)
                : null;
            var badge  = '';
            if (v.changecount && parseInt(v.changecount) > 0) {
                badge = '<span class="change-badge change-up">'+v.changecount+' changes</span>';
            }
            var typePill = v.vehicletype === 'Car'
                ? '<span style="background:rgba(99,102,241,.15);color:#a5b4fc;border:1px solid rgba(99,102,241,.2)" class="text-xs px-2 py-0.5 rounded-md font-medium">Car</span>'
                : '<span style="background:rgba(234,179,8,.12);color:#facc15;border:1px solid rgba(234,179,8,.2)" class="text-xs px-2 py-0.5 rounded-md font-medium">Moto</span>';
            var isNew = v.vehicleisnew === 'true'
                ? '<span class="text-xs text-emerald-400">New</span>'
                : '<span class="text-xs text-slate-500">Used</span>';
            var actions = isAdmin
                ? '<button class="btn-ghost btn-sm mr-1" onclick="openEditModal(\''+v.vehicleid+'\',\''+escHtml(v.vehiclebrand)+' '+escHtml(v.vehiclename)+'\',\''+v.vehicleprice+'\')">Edit</button>'
                  +'<button class="btn-ghost btn-sm" onclick="openHistoryModal(\''+v.vehicleid+'\',\''+escHtml(v.vehiclebrand)+' '+escHtml(v.vehiclename)+'\')">History</button>'
                : '<button class="btn-ghost btn-sm" onclick="openHistoryModal(\''+v.vehicleid+'\',\''+escHtml(v.vehiclebrand)+' '+escHtml(v.vehiclename)+'\')">History</button>';

            var checked = selectedIds.has(v.vehicleid) ? 'checked' : '';
            html += '<tr data-id="'+v.vehicleid+'">'
                + '<td><input type="checkbox" class="check-row row-check" value="'+v.vehicleid+'" '+checked+' onchange="toggleRow(this)"></td>'
                + '<td><div class="font-semibold text-white text-sm">'+escHtml(v.vehiclebrand)+' '+escHtml(v.vehiclename)+'</div>'
                +     '<div class="text-xs text-slate-500 mt-0.5">'+escHtml(v.vehicletrim)+' &middot; '+isNew+'</div></td>'
                + '<td>'+typePill+'</td>'
                + '<td class="text-slate-300">'+v.vehicleyear+'</td>'
                + '<td class="font-semibold text-white">'+rp(v.vehicleprice)+'</td>'
                + '<td class="text-slate-400 text-xs">'+(v.lastchangedat ? v.lastchangedat.slice(0,16) : '—')+'</td>'
                + '<td>'+badge+'</td>'
                + '<td>'+actions+'</td>'
                + '</tr>';
        });
        $('#priceBody').html(html);
    }

    function renderPagination(total, page, perPage) {
        totalPages = Math.ceil(total / perPage) || 1;
        var from = (page-1)*perPage+1, to = Math.min(page*perPage, total);
        $('#paginationInfo').text('Showing '+from+'–'+to+' of '+total+' vehicles');
        var html = '';
        for (var i=1; i<=totalPages; i++) {
            var active = i===page ? 'bg-indigo-600 text-white border-indigo-500' : 'glass-sm text-slate-400 hover:text-white';
            html += '<button class="btn-ghost btn-sm '+active+'" style="min-width:32px" onclick="loadPrices('+i+')">'+i+'</button>';
        }
        $('#paginationBtns').html(html);
    }

    /* ── Selection ── */
    function toggleRow(el) {
        if (el.checked) selectedIds.add(el.value);
        else selectedIds.delete(el.value);
        updateBulkPanel();
    }
    function toggleSelectAll() {
        var checked = $('#selectAllChk').prop('checked');
        $('.row-check').each(function() {
            this.checked = checked;
            if (checked) selectedIds.add(this.value);
            else selectedIds.delete(this.value);
        });
        updateBulkPanel();
    }
    function clearSelection() {
        selectedIds.clear();
        $('.row-check').prop('checked', false);
        $('#selectAllChk').prop('checked', false);
        updateBulkPanel();
    }
    function updateBulkPanel() {
        if (selectedIds.size > 0 && isAdmin) {
            $('#bulkPanel').addClass('visible');
            $('#bulkCount').text(selectedIds.size + ' selected');
        } else {
            $('#bulkPanel').removeClass('visible');
        }
    }

    /* ── Bulk update ── */
    function doBulkUpdate() {
        var pct = parseFloat($('#bulkPct').val());
        if (isNaN(pct) || pct === 0) { Swal.fire({ icon:'warning', title:'Enter %', text:'Please enter a non-zero adjustment percentage.', background:'#0f172a', color:'#e2e8f0', confirmButtonColor:'#6366f1' }); return; }
        var ids = Array.from(selectedIds);
        Swal.fire({
            title: 'Confirm Bulk Price Update',
            text: ids.length+' vehicles will be adjusted by '+(pct>0?'+':'')+pct+'%',
            icon: 'question', showCancelButton:true, confirmButtonText:'Apply',
            background:'#0f172a', color:'#e2e8f0', confirmButtonColor:'#6366f1'
        }).then(function(res) {
            if (!res.isConfirmed) return;
            callAPI('bulkUpdatePrice_'+menuId, {
                vehicleids: ids, adjustment: pct,
                reason: $('#bulkReason').val() || ('Bulk '+pct+'%')
            }).done(function(r) {
                if (r.status) {
                    Swal.fire({ icon:'success', title:'Done', text:r.msg, background:'#0f172a', color:'#e2e8f0', confirmButtonColor:'#6366f1' });
                    clearSelection(); $('#bulkPct').val(''); $('#bulkReason').val('');
                    loadPrices(currentPage);
                } else {
                    Swal.fire({ icon:'error', title:'Error', text:r.msg, background:'#0f172a', color:'#e2e8f0', confirmButtonColor:'#6366f1' });
                }
            });
        });
    }

    /* ── Edit modal ── */
    function openEditModal(vehicleid, title, currentPrice) {
        editVehicleId = vehicleid;
        $('#editModalTitle').text('Update Price');
        $('#editModalSub').text(title);
        $('#editCurrentPrice').text(rp(currentPrice));
        $('#editNewPrice').val('');
        $('#editReason').val('');
        bindRupiahInput('editNewPrice');
        $('#priceEditModal').addClass('modal-open');
        setTimeout(function(){ $('#editNewPrice').focus(); }, 100);
    }
    function closeEditModal() { $('#priceEditModal').removeClass('modal-open'); editVehicleId = null; }

    function submitPriceEdit() {
        var newPrice = getRupiahValue('editNewPrice');
        var reason   = $('#editReason').val().trim();
        if (!newPrice || parseFloat(newPrice) <= 0) {
            Swal.fire({ icon:'warning', title:'Invalid', text:'Please enter a valid price greater than 0.', background:'#0f172a', color:'#e2e8f0', confirmButtonColor:'#6366f1' });
            return;
        }
        callAPI('updatePrice_'+menuId, { vehicleid: editVehicleId, newprice: newPrice, reason: reason })
            .done(function(r) {
                if (r.status) {
                    var pctTxt = r.data.changepct >= 0 ? '+'+r.data.changepct+'%' : r.data.changepct+'%';
                    Swal.fire({ icon:'success', title:'Price Updated', text:'Change: '+pctTxt, background:'#0f172a', color:'#e2e8f0', confirmButtonColor:'#6366f1' });
                    closeEditModal(); loadPrices(currentPage);
                } else {
                    Swal.fire({ icon:'error', title:'Error', text:r.msg, background:'#0f172a', color:'#e2e8f0', confirmButtonColor:'#6366f1' });
                }
            });
    }

    /* ── History modal ── */
    function openHistoryModal(vehicleid, title) {
        $('#historyModalTitle').text('Price History');
        $('#historyModalSub').text(title);
        $('#historyList').html('<div class="text-center text-slate-500 py-8">Loading…</div>');
        $('#historyModal').addClass('modal-open');

        callAPI('getPriceHistory_'+menuId, { vehicleid: vehicleid }).done(function(r) {
            if (!r.status || !r.data.history.length) {
                $('#historyList').html('<div class="text-center text-slate-500 py-8">No price changes recorded yet.</div>');
                return;
            }
            var html = '';
            r.data.history.forEach(function(h) {
                var pct   = parseFloat(h.phchangepct||0);
                var dir   = pct >= 0 ? 'change-up' : 'change-down';
                var arrow = pct >= 0 ? '↑' : '↓';
                html += '<div class="glass-sm rounded-xl p-3 flex items-start gap-3">'
                    + '<div class="w-8 h-8 rounded-lg flex items-center justify-center flex-shrink-0 '+(pct>=0?'bg-emerald-900/40 text-emerald-400':'bg-red-900/40 text-red-400')+'">'+arrow+'</div>'
                    + '<div class="flex-1 min-w-0">'
                    +   '<div class="flex items-center gap-2 flex-wrap">'
                    +     '<span class="text-white font-semibold text-sm">'+rp(h.phnew)+'</span>'
                    +     '<span class="change-badge '+dir+'">'+arrow+' '+Math.abs(pct)+'%</span>'
                    +     '<span class="text-slate-500 text-xs">from '+rp(h.phold)+'</span>'
                    +   '</div>'
                    +   '<div class="text-xs text-slate-500 mt-1">'+(h.phreason||'No reason given')+' &middot; by <span class="text-slate-400">'+h.phchangedby+'</span></div>'
                    +   '<div class="text-xs text-slate-600 mt-0.5">'+h.phchangedat+'</div>'
                    + '</div></div>';
            });
            $('#historyList').html(html);
        });
    }
    function closeHistoryModal() { $('#historyModal').removeClass('modal-open'); }

    // Close modals on backdrop click
    $('#priceEditModal,#historyModal').on('click', function(e) {
        if (e.target === this) { closeEditModal(); closeHistoryModal(); }
    });

    function escHtml(s) { return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

    // Access guard
    if (!window.VDMS_CONFIG || window.VDMS_CONFIG.role === 'viewer') {
        document.body.innerHTML = '<div style="display:flex;align-items:center;justify-content:center;height:100vh;color:#f87171;font-family:Inter,sans-serif;font-size:15px">Access denied. Insufficient permissions.</div>';
    } else {
        loadPrices(1);
    }
    </script>
</body>
</html>
