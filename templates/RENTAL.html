<body class="flex h-screen overflow-hidden" style="display:flex!important;height:100vh!important;overflow:hidden!important">
    [SIDEBAR]
    <script>window.VDMS_CONFIG={role:'[USER_ROLE]',name:'[USER_NAMA]',menuId:'RENTAL'};</script>

    <div class="flex-1 flex flex-col overflow-hidden min-w-0">
        <!-- Header -->
        <header class="glass border-b border-white/5 px-6 py-4 flex items-center gap-4 flex-shrink-0">
            <div class="flex-1">
                <h1 class="text-lg font-bold text-white">Rental Management</h1>
                <p class="text-xs text-slate-500 mt-0.5">Create and track vehicle rental agreements</p>
            </div>
            <button class="btn-indigo flex items-center gap-2" onclick="openNewRentalModal()">
                <svg width="14" height="14" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2.5" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
                New Rental
            </button>
        </header>

        <!-- Stats row -->
        <div class="px-6 py-3 flex gap-3 border-b border-white/5 flex-shrink-0 overflow-x-auto">
            <div class="stat-card flex-shrink-0 min-w-[110px]">
                <div class="text-xs text-slate-500 font-medium mb-1">Total</div>
                <div class="text-xl font-bold text-white" id="statTotal">—</div>
            </div>
            <div class="stat-card flex-shrink-0 min-w-[110px]">
                <div class="text-xs text-yellow-400 font-medium mb-1">Pending</div>
                <div class="text-xl font-bold text-yellow-300" id="statPending">—</div>
            </div>
            <div class="stat-card flex-shrink-0 min-w-[110px]">
                <div class="text-xs text-blue-400 font-medium mb-1">Ongoing</div>
                <div class="text-xl font-bold text-blue-300" id="statOngoing">—</div>
            </div>
            <div class="stat-card flex-shrink-0 min-w-[110px]">
                <div class="text-xs text-emerald-400 font-medium mb-1">Completed</div>
                <div class="text-xl font-bold text-emerald-300" id="statCompleted">—</div>
            </div>
            <div class="stat-card flex-shrink-0 min-w-[140px]">
                <div class="text-xs text-indigo-400 font-medium mb-1">Revenue</div>
                <div class="text-xl font-bold text-indigo-300" id="statRevenue">—</div>
            </div>
        </div>

        <!-- Filters (desktop) -->
        <div class="desktop-filters px-6 py-3 flex gap-3 flex-shrink-0 flex-wrap border-b border-white/5">
            <input type="text" id="searchInput" placeholder="Search customer, vehicle…" class="input-dark" style="width:220px" oninput="debounceSearch()">
            <select id="statusFilter" class="input-dark" style="width:150px" onchange="loadRentals(1)">
                <option value="">All Status</option>
                <option value="pending">Pending</option>
                <option value="confirmed">Confirmed</option>
                <option value="ongoing">Ongoing</option>
                <option value="completed">Completed</option>
                <option value="cancelled">Cancelled</option>
            </select>
            <button class="btn-ghost" onclick="loadRentals(1)">Refresh</button>
        </div>

        <!-- Table -->
        <div class="flex-1 overflow-auto px-6 py-4">
            <div class="glass rounded-xl overflow-hidden">
                <table class="data-table">
                    <thead><tr>
                        <th>Customer</th><th>Vehicle</th><th>Period</th>
                        <th>Duration</th><th>Total</th><th>Status</th><th>Actions</th>
                    </tr></thead>
                    <tbody id="rentalBody"><tr><td colspan="7" class="text-center py-12 text-slate-500">Loading…</td></tr></tbody>
                </table>
            </div>
            <div class="flex items-center justify-between mt-4 text-sm text-slate-500">
                <span id="pageInfo"></span>
                <div class="flex gap-2" id="pageBtns"></div>
            </div>
        </div>
    </div>

    <!-- New Rental Modal -->
    <div id="rentalModal">
      <div class="modal-card p-6" style="width:540px;max-height:90vh;overflow-y:auto">
        <div class="flex items-center justify-between mb-5">
            <h3 class="font-bold text-white text-base">New Rental Agreement</h3>
            <button onclick="closeRentalModal()" style="background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);color:#94a3b8;width:32px;height:32px;border-radius:8px;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:all .2s;padding:0;" onmouseenter="this.style.background='rgba(239,68,68,.15)';this.style.borderColor='rgba(239,68,68,.3)';this.style.color='#f87171';" onmouseleave="this.style.background='rgba(255,255,255,.06)';this.style.borderColor='rgba(255,255,255,.1)';this.style.color='#94a3b8';" onmousedown="this.style.transform='scale(.91)'" onmouseup="this.style.transform='scale(1)'">
                <svg width="14" height="14" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2.5" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
            </button>
        </div>
        <div class="form-group">
            <label class="form-label">Select Vehicle *</label>
            <select id="rVehicle" class="input-dark"><option value="">Loading vehicles…</option></select>
        </div>
        <div class="grid2">
            <div class="form-group">
                <label class="form-label">Customer Name *</label>
                <input type="text" id="rCustName" class="input-dark" placeholder="Full name">
            </div>
            <div class="form-group">
                <label class="form-label">Phone</label>
                <input type="text" id="rCustPhone" class="input-dark" placeholder="08xx-xxxx-xxxx">
            </div>
        </div>
        <div class="grid2">
            <div class="form-group">
                <label class="form-label">Start Date *</label>
                <input type="date" id="rStartDate" class="input-dark">
            </div>
            <div class="form-group">
                <label class="form-label">End Date *</label>
                <input type="date" id="rEndDate" class="input-dark">
            </div>
        </div>
        <div class="grid2">
            <div class="form-group">
                <label class="form-label">Daily Rate (Rp) *</label>
                <input type="text" inputmode="numeric" id="rDailyRate" class="input-dark" placeholder="0">
            </div>
            <div class="form-group">
                <label class="form-label">Deposit (Rp)</label>
                <input type="text" inputmode="numeric" id="rDeposit" class="input-dark" placeholder="0">
            </div>
        </div>
        <div id="rPreview" class="glass-sm rounded-xl p-3 mb-4 text-sm text-slate-400" style="display:none">
            Estimated total: <span id="rTotalPreview" class="text-white font-bold"></span>
        </div>
        <div class="form-group">
            <label class="form-label">Notes</label>
            <textarea id="rNotes" class="input-dark" rows="2" placeholder="Additional notes…" style="resize:none"></textarea>
        </div>
        <div class="flex gap-3 mt-2">
            <button class="btn-indigo flex-1" onclick="submitRental()">Create Rental</button>
            <button onclick="closeRentalModal()" style="background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.1);color:#94a3b8;border-radius:8px;padding:9px 18px;font-size:13px;font-weight:500;cursor:pointer;transition:all .2s;flex:1;" onmouseenter="this.style.background='rgba(255,255,255,.08)';this.style.color='#e2e8f0'" onmouseleave="this.style.background='rgba(255,255,255,.04)';this.style.color='#94a3b8'">Cancel</button>
        </div>
      </div>
    </div>

    <!-- Detail Modal -->
    <div id="detailModal">
      <div class="modal-card p-6" style="width:500px">
        <div class="flex items-center justify-between mb-4">
            <h3 class="font-bold text-white text-base">Rental Detail</h3>
            <button onclick="closeDetailModal()" style="background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);color:#94a3b8;width:32px;height:32px;border-radius:8px;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:all .2s;padding:0;" onmouseenter="this.style.background='rgba(239,68,68,.15)';this.style.borderColor='rgba(239,68,68,.3)';this.style.color='#f87171';" onmouseleave="this.style.background='rgba(255,255,255,.06)';this.style.borderColor='rgba(255,255,255,.1)';this.style.color='#94a3b8';" onmousedown="this.style.transform='scale(.91)'" onmouseup="this.style.transform='scale(1)'">
                <svg width="14" height="14" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2.5" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
            </button>
        </div>
        <div id="detailContent" class="space-y-3 text-sm"></div>
        <div class="mt-4 pt-4 border-t border-white/5">
            <div class="form-label mb-2">Update Status</div>
            <div class="flex gap-2 flex-wrap">
                <button class="btn-ghost btn-sm" onclick="setStatus('confirmed')">Confirm</button>
                <button class="btn-ghost btn-sm" onclick="setStatus('ongoing')" style="color:#93c5fd">Start</button>
                <button class="btn-ghost btn-sm" onclick="setStatus('completed')" style="color:#6ee7b7">Complete</button>
                <button class="btn-ghost btn-sm" onclick="setStatus('cancelled')" style="color:#f87171">Cancel</button>
            </div>
        </div>
      </div>
    </div>

    <script>
    var menuId='RENTAL', currentPage=1, currentRentalId=null, searchTimer=null;
    function callAPI(api,data){return $.ajax({url:'/',type:'POST',contentType:'application/json',data:JSON.stringify({type:'API',menuId:menuId,data:data||{},apiName:api}),dataType:'json'});}
    function rp(v){return 'Rp\u00a0'+parseFloat(v||0).toLocaleString('id-ID');}
    function escHtml(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
    function debounceSearch(){clearTimeout(searchTimer);searchTimer=setTimeout(function(){loadRentals(1);},350);}

    var STATUS_CLASS={pending:'s-pending',confirmed:'s-confirmed',ongoing:'s-ongoing',completed:'s-completed',cancelled:'s-cancelled'};

    function loadStats(){
        callAPI('getRentalStats_'+menuId,{}).done(function(r){
            if(!r.status)return;
            var d=r.data;
            $('#statTotal').text(d.total||'0');
            $('#statPending').text(d.pending||'0');
            $('#statOngoing').text(d.ongoing||'0');
            $('#statCompleted').text(d.completed||'0');
            $('#statRevenue').text(rp(d.totalrevenue||0));
        });
    }

    function loadRentals(page){
        currentPage=page||1;
        callAPI('getRentals_'+menuId,{search:$('#searchInput').val(),status:$('#statusFilter').val(),page:currentPage})
        .done(function(r){
            if(!r.status){$('#rentalBody').html('<tr><td colspan="7" class="text-center py-10 text-red-400">'+escHtml(r.msg)+'</td></tr>');return;}
            renderTable(r.data.rentals);
            renderPagination(r.data.total,r.data.page,r.data.per_page);
        });
    }

    function renderTable(rows){
        if(!rows||!rows.length){$('#rentalBody').html('<tr><td colspan="7" class="text-center py-12 text-slate-500">No rentals found</td></tr>');return;}
        var html='';
        rows.forEach(function(r){
            var sc=STATUS_CLASS[r.rentalstatus]||'s-pending';
            var del=window.VDMS_CONFIG.role==='admin'
                ?'<button class="btn-ghost btn-sm ml-1" style="color:#f87171" onclick="deleteRental(\''+r.rentalid+'\')">Del</button>':'';
            html+='<tr>'
                +'<td><div class="font-medium text-white">'+escHtml(r.rentalcustname)+'</div><div class="text-xs text-slate-500">'+escHtml(r.rentalcustphone||'—')+'</div></td>'
                +'<td><div class="text-sm text-white">'+escHtml(r.vehiclebrand+' '+r.vehiclename)+'</div><div class="text-xs text-slate-500">'+escHtml(r.vehicletrim)+' '+r.vehicleyear+'</div></td>'
                +'<td class="text-xs text-slate-400">'+r.rentalstartdate+' → '+r.rentalenddate+'</td>'
                +'<td class="text-slate-300 text-center">'+r.rentaldurationdays+'d</td>'
                +'<td class="font-semibold text-white">'+rp(r.rentaltotalprice)+'</td>'
                +'<td><span class="status-badge '+sc+'">'+r.rentalstatus+'</span></td>'
                +'<td><button class="btn-ghost btn-sm" onclick="openDetail(\''+r.rentalid+'\')">View</button>'+del+'</td>'
                +'</tr>';
        });
        $('#rentalBody').html(html);
    }

    function renderPagination(total,page,per){
        var tp=Math.ceil(total/per)||1;
        $('#pageInfo').text('Showing '+((page-1)*per+1)+'–'+Math.min(page*per,total)+' of '+total);
        var html='';
        for(var i=1;i<=tp;i++){var a=i===page?'bg-indigo-600 text-white':'';html+='<button class="btn-ghost btn-sm '+a+'" style="min-width:32px" onclick="loadRentals('+i+')">'+i+'</button>';}
        $('#pageBtns').html(html);
    }

    /* ── New Rental Modal ── */
    function openNewRentalModal(){
        callAPI('getAvailableVehicles_'+menuId,{}).done(function(r){
            var opts='<option value="">Select vehicle…</option>';
            (r.data||[]).forEach(function(v){opts+='<option value="'+v.vehicleid+'">'+escHtml(v.vehiclebrand+' '+v.vehiclename+' '+v.vehicletrim)+' ('+v.vehicleyear+')</option>';});
            $('#rVehicle').html(opts);
        });
        ['rVehicle','rCustName','rCustPhone','rStartDate','rEndDate','rNotes'].forEach(function(id){$('#'+id).val('');});
        $('#rDailyRate').val('');$('#rDeposit').val('');
        $('#rPreview').hide();
        bindRupiahInput('rDailyRate');
        bindRupiahInput('rDeposit');
        $('#rStartDate,#rEndDate').off('change.prev input.prev').on('change.prev input.prev', updatePreview);
        $('#rDailyRate').off('input.prev').on('input.prev', updatePreview);
        $('#rentalModal').addClass('modal-open');
    }
    function closeRentalModal(){$('#rentalModal').removeClass('modal-open');}

    // Live total preview
    function updatePreview(){
        var s=$('#rStartDate').val(),e=$('#rEndDate').val(),rate=parseFloat(getRupiahValue('rDailyRate')||0);
        if(s&&e&&rate>0){
            var days=Math.round((new Date(e)-new Date(s))/(1000*86400));
            if(days>0){$('#rTotalPreview').text(rp(days*rate)+' ('+days+' days)');$('#rPreview').show();return;}
        }
        $('#rPreview').hide();
    }

    function submitRental(){
        var data={vehicleid:$('#rVehicle').val(),custname:$('#rCustName').val(),custphone:$('#rCustPhone').val(),
            startdate:$('#rStartDate').val(),enddate:$('#rEndDate').val(),
            dailyrate:getRupiahValue('rDailyRate'),deposit:getRupiahValue('rDeposit')||0,notes:$('#rNotes').val()};
        callAPI('createRental_'+menuId,data).done(function(r){
            if(r.status){Swal.fire({icon:'success',title:'Rental Created',text:'Rental agreement has been recorded.',background:'#0f172a',color:'#e2e8f0',confirmButtonColor:'#6366f1'});closeRentalModal();loadRentals(1);loadStats();}
            else{Swal.fire({icon:'error',title:'Error',text:r.msg,background:'#0f172a',color:'#e2e8f0',confirmButtonColor:'#6366f1'});}
        });
    }

    /* ── Detail Modal ── */
    function openDetail(id){
        currentRentalId=id;
        $('#detailContent').html('<div class="text-slate-500 text-center py-4">Loading…</div>');
        $('#detailModal').addClass('modal-open');
        callAPI('getRentalDetail_'+menuId,{rentalid:id}).done(function(r){
            if(!r.status){$('#detailContent').html('<div class="text-red-400">'+r.msg+'</div>');return;}
            var d=r.data;
            var sc=STATUS_CLASS[d.rentalstatus]||'s-pending';
            $('#detailContent').html(
                '<div class="flex items-center justify-between"><span class="font-bold text-white text-sm">'+escHtml(d.vehiclebrand+' '+d.vehiclename)+'</span><span class="status-badge '+sc+'">'+d.rentalstatus+'</span></div>'
                +'<div class="glass-sm rounded-xl p-3 grid grid-cols-2 gap-2 text-xs">'
                +row('Customer',d.rentalcustname)+row('Phone',d.rentalcustphone||'—')
                +row('Start',d.rentalstartdate)+row('End',d.rentalenddate)
                +row('Duration',d.rentaldurationdays+' days')+row('Daily Rate',rp(d.rentaldailyrate))
                +row('Total',rp(d.rentaltotalprice))+row('Deposit',rp(d.rentaldeposit))
                +'</div>'
                +(d.rentalnotes?'<div class="text-xs text-slate-400 italic">'+escHtml(d.rentalnotes)+'</div>':'')
            );
        });
    }
    function row(l,v){return '<div><span class="text-slate-500">'+l+'</span><br><span class="text-white font-medium">'+escHtml(String(v||''))+'</span></div>';}
    function closeDetailModal(){$('#detailModal').removeClass('modal-open');currentRentalId=null;}

    function setStatus(s){
        if(!currentRentalId)return;
        var labels={confirmed:'Confirm',ongoing:'Start Rental',completed:'Complete',cancelled:'Cancel'};
        var confirmColor=s==='cancelled'?'#ef4444':s==='completed'?'#10b981':'#6366f1';
        Swal.fire({
            title:'Set status to "'+s.toUpperCase()+'"?',
            text:s==='ongoing'?'This will mark the rental as currently ongoing.'
                :s==='completed'?'Mark this rental as fully completed.'
                :s==='cancelled'?'Cancel this rental agreement?'
                :'Confirm this rental booking?',
            icon:s==='cancelled'?'warning':'question',
            showCancelButton:true,
            confirmButtonText:labels[s]||'Confirm',
            cancelButtonText:'Go Back',
            confirmButtonColor:confirmColor,
            background:'#0f172a',color:'#e2e8f0'
        }).then(function(res){
            if(!res.isConfirmed)return;
            $('#detailModal .btn-ghost').prop('disabled',true);
            callAPI('updateRentalStatus_'+menuId,{rentalid:currentRentalId,status:s})
            .done(function(r){
                $('#detailModal .btn-ghost').prop('disabled',false);
                if(r.status){
                    Swal.fire({
                        icon:'success',title:'Updated',
                        text:'Status changed to "'+s.toUpperCase()+'".',
                        timer:1400,showConfirmButton:false,
                        background:'#0f172a',color:'#e2e8f0'
                    }).then(function(){
                        closeDetailModal();
                        loadRentals(currentPage);
                        loadStats();
                    });
                } else {
                    Swal.fire({icon:'error',title:'Error',text:r.msg,background:'#0f172a',color:'#e2e8f0',confirmButtonColor:'#6366f1'});
                }
            })
            .fail(function(){
                $('#detailModal .btn-ghost').prop('disabled',false);
                Swal.fire({icon:'error',title:'Network Error',text:'Could not update status. Please try again.',background:'#0f172a',color:'#e2e8f0',confirmButtonColor:'#6366f1'});
            });
        });
    }

    function deleteRental(id){
        Swal.fire({title:'Delete rental?',text:'Only pending/cancelled rentals can be deleted.',icon:'warning',showCancelButton:true,confirmButtonText:'Delete',confirmButtonColor:'#ef4444',background:'#0f172a',color:'#e2e8f0'})
        .then(function(res){
            if(!res.isConfirmed)return;
            callAPI('deleteRental_'+menuId,{rentalid:id}).done(function(r){
                if(r.status){loadRentals(currentPage);loadStats();}
                else{Swal.fire({icon:'error',title:'Error',text:r.msg,background:'#0f172a',color:'#e2e8f0',confirmButtonColor:'#6366f1'});}
            });
        });
    }

    $('#rentalModal').on('click',function(e){if(e.target===this)closeRentalModal();});
    $('#detailModal').on('click',function(e){if(e.target===this)closeDetailModal();});
    if(!window.VDMS_CONFIG||window.VDMS_CONFIG.role==='viewer'){document.body.innerHTML='<div style="display:flex;align-items:center;justify-content:center;height:100vh;color:#f87171;font-family:Inter,sans-serif">Access denied.</div>';}
    else{loadStats();loadRentals(1);}
    
/* mobileFilterSetup — RENTAL */
(function(){
  if(window.innerWidth>768) return;
  function buildMobileFilter(){
    var body=document.getElementById('mobileFilterBody');
    if(!body)return;
    body.innerHTML=
      '<div><label class="mfp-label">Search</label><input class="mfp-input" id="mfSearch" placeholder="Customer, vehicle…" value="'+($('#searchInput').val()||'')+'" oninput="document.getElementById('searchInput').value=this.value"></div>'
      +'<div><label class="mfp-label">Status</label><select class="mfp-input" id="mfStatus" onchange="document.getElementById('statusFilter').value=this.value"><option value="">All Status</option><option value="pending">Pending</option><option value="confirmed">Confirmed</option><option value="ongoing">Ongoing</option><option value="completed">Completed</option><option value="cancelled">Cancelled</option></select></div>'
      +'<button class="mfp-apply" onclick="loadRentals(1);closeMobileFilter();">Apply</button>';
    document.getElementById('mfStatus').value=$('#statusFilter').val()||'';
  }
  document.getElementById('mobileFilterBtn').addEventListener('click', buildMobileFilter);
})();

</script>
</body>
