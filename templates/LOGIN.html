    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        input, textarea, select {
            background: rgba(15,23,42,0.8) !important;
            background-color: rgba(15,23,42,0.8) !important;
            color: #e2e8f0 !important;
            -webkit-text-fill-color: #e2e8f0 !important;
        }
        * { font-family: 'Inter', sans-serif; }

        body {
            background: #020817;
            overflow: hidden;
        }

        /* Animated grid background */
        .bg-grid {
            position: fixed; inset: 0; z-index: 0;
            background-image:
                linear-gradient(rgba(99,102,241,0.07) 1px, transparent 1px),
                linear-gradient(90deg, rgba(99,102,241,0.07) 1px, transparent 1px);
            background-size: 40px 40px;
            animation: gridMove 20s linear infinite;
        }
        @keyframes gridMove {
            0%   { background-position: 0 0; }
            100% { background-position: 40px 40px; }
        }

        /* Glowing orbs */
        .orb {
            position: fixed; border-radius: 50%;
            filter: blur(120px); opacity: 0.15; z-index: 0;
            animation: orbFloat 8s ease-in-out infinite;
        }
        .orb-1 { width: 500px; height: 500px; background: #6366f1; top: -150px; left: -150px; }
        .orb-2 { width: 400px; height: 400px; background: #8b5cf6; bottom: -100px; right: -100px; animation-delay: -4s; }
        .orb-3 { width: 300px; height: 300px; background: #3b82f6; top: 40%; left: 40%; animation-delay: -2s; }
        @keyframes orbFloat {
            0%, 100% { transform: translate(0, 0) scale(1); }
            33%       { transform: translate(30px, -30px) scale(1.05); }
            66%       { transform: translate(-20px, 20px) scale(0.95); }
        }

        /* Glassmorphism card */
        .glass-card {
            background: rgba(15, 23, 42, 0.75);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid rgba(99, 102, 241, 0.2);
            box-shadow:
                0 0 0 1px rgba(99, 102, 241, 0.1),
                0 20px 60px rgba(0, 0, 0, 0.5),
                inset 0 1px 0 rgba(255, 255, 255, 0.05);
        }

        /* Input glow */
        .input-glow {
            background: rgba(255,255,255,0.04) !important;
            background-color: rgba(255,255,255,0.04) !important;
            border: 1px solid rgba(99,102,241,0.25) !important;
            color: #e2e8f0 !important;
            -webkit-text-fill-color: #e2e8f0 !important;
            caret-color: #e2e8f0;
            transition: all 0.3s ease;
            appearance: none;
            -webkit-appearance: none;
        }
        .input-glow::placeholder { color: rgba(148,163,184,0.5) !important; }
        input:-webkit-autofill,
        input:-webkit-autofill:hover,
        input:-webkit-autofill:focus,
        input:-webkit-autofill:active {
            -webkit-box-shadow: 0 0 0 1000px #0d1629 inset !important;
            -webkit-text-fill-color: #e2e8f0 !important;
            caret-color: #e2e8f0 !important;
            border: 1px solid rgba(99,102,241,0.3) !important;
            border-radius: .75rem !important;
        }
        .input-glow:focus {
            outline: none;
            border-color: #6366f1 !important;
            background: rgba(99,102,241,0.08) !important;
            background-color: rgba(99,102,241,0.08) !important;
            box-shadow: 0 0 0 3px rgba(99,102,241,0.15), 0 0 20px rgba(99,102,241,0.1);
        }

        /* Gradient button */
        .btn-primary {
            background: linear-gradient(135deg, #6366f1 0%, #8b5cf6 100%);
            border: none;
            color: white;
            font-weight: 600;
            letter-spacing: 0.025em;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }
        .btn-primary::before {
            content: '';
            position: absolute; inset: 0;
            background: linear-gradient(135deg, #818cf8 0%, #a78bfa 100%);
            opacity: 0;
            transition: opacity 0.3s ease;
        }
        .btn-primary:hover::before { opacity: 1; }
        .btn-primary:hover { transform: translateY(-1px); box-shadow: 0 8px 25px rgba(99, 102, 241, 0.4); }
        .btn-primary:active { transform: translateY(0); }
        .btn-primary:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }
        .btn-primary span { position: relative; z-index: 1; }

        /* Logo pulse */
        .logo-ring {
            width: 72px; height: 72px;
            background: linear-gradient(135deg, rgba(99,102,241,0.2), rgba(139,92,246,0.2));
            border: 1px solid rgba(99,102,241,0.4);
            border-radius: 20px;
            display: flex; align-items: center; justify-content: center;
            position: relative;
            box-shadow: 0 0 30px rgba(99,102,241,0.2);
        }
        .logo-ring::before {
            content: '';
            position: absolute; inset: -4px;
            border-radius: 24px;
            border: 1px solid rgba(99,102,241,0.15);
            animation: ringPulse 3s ease-in-out infinite;
        }
        @keyframes ringPulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.5; transform: scale(1.05); }
        }


    </style>
</head>
<body style="min-height:100vh;display:flex;align-items:center;justify-content:center;padding:1rem;background:#020817;overflow:hidden;">
    <div class="bg-grid"></div>
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
    <div class="orb orb-3"></div>

    <div class="glass-card" style="width:100%;max-width:380px;padding:2rem;border-radius:1rem;position:relative;z-index:10;">

        <!-- Logo -->
        <div style="display:flex;flex-direction:column;align-items:center;margin-bottom:2rem;">
            <div class="logo-ring" style="margin-bottom:1rem;">
                <svg width="36" height="36" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M3 12l9-9 9 9M5 10v8a1 1 0 001 1h4v-5h4v5h4a1 1 0 001-1v-8" stroke="#818cf8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                    <circle cx="12" cy="17" r="1" fill="#818cf8"/>
                </svg>
            </div>
            <h1 style="font-size:1.5rem;font-weight:700;color:#fff;letter-spacing:-.025em;margin:0;">VDMS</h1>
            <p style="color:#94a3b8;font-size:.875rem;margin:.25rem 0 0;font-weight:500;">Vehicle Dealer Management System</p>
            <div style="width:6rem;height:1px;margin-top:.5rem;background:linear-gradient(90deg,transparent,#6366f1,transparent);opacity:.6;"></div>
        </div>

        <!-- Form -->
        <div style="display:flex;flex-direction:column;gap:1rem;">
            <div>
                <label style="display:block;font-size:.7rem;font-weight:700;color:#94a3b8;text-transform:uppercase;letter-spacing:.07em;margin-bottom:.375rem;">Username</label>
                <input
                    id="username" type="text" placeholder="Enter your username"
                    autocomplete="username" style="width:100%;padding:.75rem 1rem;font-size:.875rem;border-radius:.75rem;background:rgba(15,23,42,0.8);background-color:rgba(15,23,42,0.8);border:1px solid rgba(99,102,241,0.3);color:#e2e8f0;outline:none;box-sizing:border-box;font-family:Inter,sans-serif;" onfocus="this.style.borderColor='#6366f1';this.style.boxShadow='0 0 0 3px rgba(99,102,241,0.2)'" onblur="this.style.borderColor='rgba(99,102,241,0.3)';this.style.boxShadow='none'"
                />
            </div>
            <div>
                <label style="display:block;font-size:.7rem;font-weight:700;color:#94a3b8;text-transform:uppercase;letter-spacing:.07em;margin-bottom:.375rem;">Password</label>
                <div style="position:relative;">
                    <input
                        id="password" type="password" placeholder="Enter your password"
                        autocomplete="current-password" style="width:100%;padding:.75rem 2.75rem .75rem 1rem;font-size:.875rem;border-radius:.75rem;background:rgba(15,23,42,0.8);background-color:rgba(15,23,42,0.8);border:1px solid rgba(99,102,241,0.3);color:#e2e8f0;outline:none;box-sizing:border-box;font-family:Inter,sans-serif;" onfocus="this.style.borderColor='#6366f1';this.style.boxShadow='0 0 0 3px rgba(99,102,241,0.2)'" onblur="this.style.borderColor='rgba(99,102,241,0.3)';this.style.boxShadow='none'"
                    />
                    <button id="togglePwd" type="button"
                        style="position:absolute;right:.75rem;top:50%;transform:translateY(-50%);background:none;border:none;cursor:pointer;color:#64748b;line-height:0;padding:0;">
                        <svg id="eyeIcon" width="18" height="18" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z" stroke-width="2" stroke-linecap="round"/>
                            <circle cx="12" cy="12" r="3" stroke-width="2"/>
                        </svg>
                    </button>
                </div>
            </div>

            <button id="btnSignIn" class="btn-primary" style="width:100%;margin-top:.5rem;padding:.75rem 1rem;font-size:.875rem;border-radius:.75rem;">
                <span style="display:flex;align-items:center;justify-content:center;gap:.5rem;position:relative;z-index:1;">
                    <svg width="16" height="16" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path d="M15 3h4a2 2 0 012 2v14a2 2 0 01-2 2h-4M10 17l5-5-5-5M15 12H3" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                    Sign In
                </span>
            </button>
        </div>
    </div>

    <script>
        var menuId = 'LOGIN';

        function callAPI(menuId, apiName, data) {
            return $.ajax({
                url: '/', type: 'POST', contentType: 'application/json',
                data: JSON.stringify({ type: "API", menuId: menuId, data: data, apiName: apiName }),
                dataType: 'json'
            });
        }

        // Toggle password visibility
        $('#togglePwd').on('click', function () {
            var inp = $('#password');
            var isText = inp.attr('type') === 'text';
            inp.attr('type', isText ? 'password' : 'text');
            $('#eyeIcon').html(isText
                ? '<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z" stroke-width="2" stroke-linecap="round"/><circle cx="12" cy="12" r="3" stroke-width="2"/>'
                : '<path d="M17.94 17.94A10.07 10.07 0 0112 20c-7 0-11-8-11-8a18.45 18.45 0 015.06-5.94M9.9 4.24A9.12 9.12 0 0112 4c7 0 11 8 11 8a18.5 18.5 0 01-2.16 3.19m-6.72-1.07a3 3 0 11-4.24-4.24M1 1l22 22" stroke-width="2" stroke-linecap="round"/>'
            );
        });

        function doLogin() {
            var username = $('#username').val().trim();
            var password = $('#password').val();
            if (!username || !password) {
                Swal.fire({ icon: 'warning', title: 'Required', text: 'Please enter username and password.', background: '#0f172a', color: '#e2e8f0', confirmButtonColor: '#6366f1' });
                return;
            }
            var $btn = $('#btnSignIn');
            $btn.prop('disabled', true).html('<span style="display:flex;align-items:center;justify-content:center;gap:.5rem;position:relative;z-index:1;"><svg class="animate-spin" width="16" height="16" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4" opacity=".25"/><path d="M4 12a8 8 0 018-8" stroke="currentColor" stroke-width="4" stroke-linecap="round"/></svg> Signing in...</span>');

            callAPI(menuId, 'login_LOGIN', { username: username, password: password })
                .done(function (response) {
                    if (response.status) {
                        window.location.href = '/?type=CUSTOM_VIEW&menuId=VEHICLE_LIST';
                    } else {
                        Swal.fire({ icon: 'error', title: 'Login Failed', text: response.msg || 'Invalid credentials', background: '#0f172a', color: '#e2e8f0', confirmButtonColor: '#6366f1' });
                        $btn.prop('disabled', false).html('<span style="display:flex;align-items:center;justify-content:center;gap:.5rem;position:relative;z-index:1;"><svg width="16" height="16" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M15 3h4a2 2 0 012 2v14a2 2 0 01-2 2h-4M10 17l5-5-5-5M15 12H3" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg> Sign In</span>');
                    }
                })
                .fail(function () {
                    Swal.fire({ icon: 'error', title: 'Error', text: 'Network error. Please try again.', background: '#0f172a', color: '#e2e8f0', confirmButtonColor: '#6366f1' });
                    $btn.prop('disabled', false).html('<span style="display:flex;align-items:center;justify-content:center;gap:.5rem;position:relative;z-index:1;">Sign In</span>');
                });
        }

        $('#btnSignIn').on('click', doLogin);
        $('#password').on('keypress', function (e) { if (e.which === 13) doLogin(); });
        $('#username').on('keypress', function (e) { if (e.which === 13) $('#password').focus(); });
    </script>
</body>
